<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的塔罗">
<link rel="manifest" href="manifest.json">
<title>我的塔罗</title>

<style>
:root{
  --bg:#111016;
  --panel:#1b1921;
  --panel2:#24212b;
  --text:#f3eee5;
  --muted:#aaa2b0;
  --gold:#cdb58a;
  --line:#393440;
  --danger:#b86d72
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:radial-gradient(circle at top,#28232e 0,#111016 48%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Noto Sans CJK SC",sans-serif;
  min-height:100%
}

body{
  padding-bottom:env(safe-area-inset-bottom)
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
  padding:20px 16px 32px
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 0 18px
}

.logo{
  font-size:24px;
  letter-spacing:.08em;
  font-weight:650
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px
}

.iconbtn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--text);
  width:42px;
  height:42px;
  border-radius:14px
}

.view{
  display:none
}

.view.active{
  display:block
}

.hero{
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:24px;
  padding:26px 20px;
  box-shadow:0 18px 60px rgba(0,0,0,.25)
}

.hero h1{
  font-size:34px;
  margin:0 0 10px
}

.hero p{
  color:var(--muted);
  line-height:1.65;
  margin:0 0 22px
}

.primary{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px 18px;
  background:var(--gold);
  color:#17130f;
  font-weight:700
}

.secondary{
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  color:var(--text);
  padding:12px 15px
}

.linkbtn{
  border:0;
  background:none;
  color:var(--gold);
  padding:8px 0
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 2px 12px;
  font-weight:650
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  padding:15px;
  border-radius:16px
}

.stat b{
  font-size:22px
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px
}

.spread-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  gap:10px
}

.count{
  color:var(--muted);
  font-size:13px
}

.table{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
  padding:6px 0 18px
}

.cardback{
  aspect-ratio:5/8;
  border-radius:9px;
  border:1px solid #776a55;
  background:
    repeating-linear-gradient(
      45deg,
      #25202a 0,
      #25202a 5px,
      #2c2631 5px,
      #2c2631 10px
    );
  box-shadow:0 6px 16px rgba(0,0,0,.28);
  position:relative;
  transition:.16s;
  touch-action:manipulation
}

.cardback:after{
  content:"✦";
  position:absolute;
  inset:8px;
  border:1px solid rgba(205,181,138,.5);
  border-radius:6px;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:18px
}

.cardback.selected{
  transform:translateY(-6px) scale(1.04);
  box-shadow:0 12px 24px rgba(205,181,138,.2);
  border-color:var(--gold)
}

.notice{
  padding:12px 14px;
  border-radius:14px;
  background:rgba(205,181,138,.08);
  color:#d8cbb6;
  font-size:13px;
  line-height:1.55;
  margin-bottom:12px
}

.bottom-actions{
  position:sticky;
  bottom:12px;
  display:flex;
  gap:10px;
  background:linear-gradient(
    transparent,
    rgba(17,16,22,.96) 35%
  );
  padding-top:24px
}

.bottom-actions button{
  flex:1
}

.revealed-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}

.drawn-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  position:relative
}

.drawn-card img{
  width:100%;
  display:block;
  border-radius:10px;
  background:#eee
}

.drawn-card.reversed img{
  transform:rotate(180deg)
}

.card-name{
  text-align:center;
  font-weight:650;
  margin:10px 4px 2px
}

.orientation{
  text-align:center;
  color:var(--gold);
  font-size:13px
}

.flip-hint{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  margin:4px 0 12px
}

.form{
  display:grid;
  gap:10px;
  margin-top:18px
}

.form input,
.form textarea{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--text);
  padding:13px;
  outline:none
}

.form textarea{
  min-height:110px;
  resize:vertical
}

.history-item{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  margin-bottom:10px
}

.history-head{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.history-date{
  color:var(--muted);
  font-size:12px
}

.history-cards{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px
}

.pill{
  background:var(--panel2);
  border:1px solid var(--line);
  padding:7px 9px;
  border-radius:10px;
  font-size:12px
}

.history-q{
  margin-top:8px;
  color:#ddd5ca;
  font-size:13px
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:50px 10px
}

.small-actions{
  display:flex;
  gap:8px;
  margin-top:12px
}

.small-actions button{
  flex:1
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20
}

.modal.show{
  display:flex
}

.sheet{
  width:min(760px,100%);
  background:#19171e;
  border:1px solid var(--line);
  border-radius:24px 24px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;
  overflow:auto
}

.sheet h2{
  margin:0 0 16px
}

.loading{
  position:fixed;
  inset:0;
  background:#111016;
  display:grid;
  place-items:center;
  z-index:30
}

.loading.hidden{
  display:none
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #3b3641;
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

@media(min-width:620px){

  .revealed-grid{
    grid-template-columns:repeat(4,minmax(0,1fr))
  }

  .table{
    grid-template-columns:repeat(10,minmax(0,1fr))
  }

  .app{
    padding-top:28px
  }

}
</style>
</head>

<body>

<div class="loading" id="loading">

  <div>

    <div class="spinner"></div>

    <div style="color:#aaa2b0;margin-top:12px;font-size:13px">
      正在准备牌桌…
    </div>

  </div>

</div>


<div class="app">

<header>

  <div>

    <div class="logo">
      🔮 我的塔罗
    </div>

    <div class="sub">
      你选牌，我只负责记录
    </div>

  </div>

  <button
    class="iconbtn"
    id="historyBtn"
    aria-label="抽牌记录"
  >
    ☰
  </button>

</header>


<!-- 首页 -->

<section id="home" class="view active">

  <div class="hero">

    <h1>
      今天，想问什么？
    </h1>

    <p>
      78 张牌全部背面朝上。
      你凭感觉点击想要的牌，想抽几张都可以。
      选好后再翻牌；同一次抽牌不会重复。
    </p>

    <button
      class="primary"
      id="startBtn"
    >
      开始抽牌
    </button>

  </div>


  <div class="section-title">
    我的记录
  </div>


  <div class="stats">

    <div class="stat">

      <b id="readingCount">
        0
      </b>

      <span>
        次抽牌
      </span>

    </div>


    <div class="stat">

      <b id="cardCount">
        0
      </b>

      <span>
        张已记录
      </span>

    </div>

  </div>

</section>


<!-- 选牌 -->

<section id="select" class="view">

  <div class="spread-toolbar">

    <button
      class="linkbtn"
      id="backHome"
    >
      ‹ 返回
    </button>

    <div class="count">

      已选择
      <b id="selectedCount">0</b>
      张

    </div>

  </div>


  <div class="notice">

    凭感觉点牌即可。
    再次点击已选的牌可以取消。
    现在不会显示任何牌名。

  </div>


  <div
    class="table"
    id="table"
  ></div>


  <div class="bottom-actions">

    <button
      class="secondary"
      id="clearSelection"
    >
      重新选
    </button>

    <button
      class="primary"
      id="confirmSelection"
    >
      选好了
    </button>

  </div>

</section>


<!-- 翻牌 -->

<section id="reveal" class="view">

  <div class="spread-toolbar">

    <button
      class="linkbtn"
      id="backSelect"
    >
      ‹ 返回选牌
    </button>

    <div class="count">

      本次
      <b id="revealCount">0</b>
      张

    </div>

  </div>


  <div class="notice">

    牌已经锁定。
    点每张牌可以单独翻开；
    正位 / 逆位会在翻牌时确定。

  </div>


  <div
    class="revealed-grid"
    id="revealedGrid"
  ></div>


  <div class="bottom-actions">

    <button
      class="secondary"
      id="revealAll"
    >
      全部翻开
    </button>

    <button
      class="primary"
      id="saveReading"
    >
      保存记录
    </button>

  </div>


  <div class="form">

    <input
      id="question"
      placeholder="今天想问的问题（可不填）"
    >

    <textarea
      id="note"
      placeholder="我的解读 / 当下的直觉 / 后续发生了什么（可不填）"
    ></textarea>

  </div>

</section>


<!-- 历史 -->

<section id="history" class="view">

  <div class="spread-toolbar">

    <button
      class="linkbtn"
      id="backFromHistory"
    >
      ‹ 返回首页
    </button>

    <div class="count">
      全部记录
    </div>

  </div>


  <div id="historyList"></div>

</section>

</div>


<!-- 历史详情 -->

<div
  class="modal"
  id="detailModal"
>

  <div class="sheet">

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center
      "
    >

      <h2>
        抽牌记录
      </h2>

      <button
        class="iconbtn"
        id="closeModal"
      >
        ×
      </button>

    </div>


    <div id="detailContent"></div>

  </div>

</div>


<script>

/* =========================================================
   牌库
   图片全部来自当前 GitHub Pages 仓库根目录
   ========================================================= */

const IMAGE_BASE = "./";


const deck = [

  /* ================= 大阿卡纳 ================= */

  {name:"愚人",code:"ar00"},
  {name:"魔术师",code:"ar01"},
  {name:"女祭司",code:"ar02"},
  {name:"皇后",code:"ar03"},
  {name:"皇帝",code:"ar04"},
  {name:"教皇",code:"ar05"},
  {name:"恋人",code:"ar06"},
  {name:"战车",code:"ar07"},
  {name:"力量",code:"ar08"},
  {name:"隐者",code:"ar09"},
  {name:"命运之轮",code:"ar10"},
  {name:"正义",code:"ar11"},
  {name:"倒吊人",code:"ar12"},
  {name:"死神",code:"ar13"},
  {name:"节制",code:"ar14"},
  {name:"恶魔",code:"ar15"},
  {name:"高塔",code:"ar16"},
  {name:"星星",code:"ar17"},
  {name:"月亮",code:"ar18"},
  {name:"太阳",code:"ar19"},
  {name:"审判",code:"ar20"},
  {name:"世界",code:"ar21"},


  /* ================= 权杖 ================= */

  {name:"权杖王牌",code:"waac"},
  {name:"权杖二",code:"wa02"},
  {name:"权杖三",code:"wa03"},
  {name:"权杖四",code:"wa04"},
  {name:"权杖五",code:"wa05"},
  {name:"权杖六",code:"wa06"},
  {name:"权杖七",code:"wa07"},
  {name:"权杖八",code:"wa08"},
  {name:"权杖九",code:"wa09"},
  {name:"权杖十",code:"wa10"},
  {name:"权杖侍者",code:"wapa"},
  {name:"权杖骑士",code:"wakn"},
  {name:"权杖王后",code:"waqu"},
  {name:"权杖国王",code:"waki"},


  /* ================= 圣杯 ================= */

  {name:"圣杯王牌",code:"cuac"},
  {name:"圣杯二",code:"cu02"},
  {name:"圣杯三",code:"cu03"},
  {name:"圣杯四",code:"cu04"},
  {name:"圣杯五",code:"cu05"},
  {name:"圣杯六",code:"cu06"},
  {name:"圣杯七",code:"cu07"},
  {name:"圣杯八",code:"cu08"},
  {name:"圣杯九",code:"cu09"},
  {name:"圣杯十",code:"cu10"},
  {name:"圣杯侍者",code:"cupa"},
  {name:"圣杯骑士",code:"cukn"},
  {name:"圣杯王后",code:"cuqu"},
  {name:"圣杯国王",code:"cuki"},


  /* ================= 宝剑 ================= */

  {name:"宝剑王牌",code:"swac"},
  {name:"宝剑二",code:"sw02"},
  {name:"宝剑三",code:"sw03"},
  {name:"宝剑四",code:"sw04"},
  {name:"宝剑五",code:"sw05"},
  {name:"宝剑六",code:"sw06"},
  {name:"宝剑七",code:"sw07"},
  {name:"宝剑八",code:"sw08"},
  {name:"宝剑九",code:"sw09"},
  {name:"宝剑十",code:"sw10"},
  {name:"宝剑侍者",code:"swpa"},
  {name:"宝剑骑士",code:"swkn"},
  {name:"宝剑王后",code:"swqu"},
  {name:"宝剑国王",code:"swki"},


  /* ================= 星币 ================= */

  {name:"星币王牌",code:"peac"},
  {name:"星币二",code:"pe02"},
  {name:"星币三",code:"pe03"},
  {name:"星币四",code:"pe04"},
  {name:"星币五",code:"pe05"},
  {name:"星币六",code:"pe06"},
  {name:"星币七",code:"pe07"},
  {name:"星币八",code:"pe08"},
  {name:"星币九",code:"pe09"},
  {name:"星币十",code:"pe10"},
  {name:"星币侍者",code:"pepa"},
  {name:"星币骑士",code:"pekn"},
  {name:"星币王后",code:"pequ"},
  {name:"星币国王",code:"peki"}

].map(card => ({

  ...card,

  image:
    IMAGE_BASE +
    card.code +
    ".jpg"

}));


/* =========================================================
   状态
   ========================================================= */

let selected = [];

let revealed = [];

let currentReading = null;


/* =========================================================
   工具
   ========================================================= */

const $ = id =>
  document.getElementById(id);


function show(id){

  document
    .querySelectorAll(".view")
    .forEach(v =>
      v.classList.remove("active")
    );

  $(id).classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );

  }catch(e){

    return [];

  }

}


function setHistory(history){

  localStorage.setItem(
    "myTarotHistory",
    JSON.stringify(history)
  );

}


function updateStats(){

  const history =
    getHistory();

  $("readingCount").textContent =
    history.length;

  $("cardCount").textContent =
    history.reduce(
      (total,reading) =>
        total + reading.cards.length,
      0
    );

}


function esc(value){

  return String(value).replace(
    /[&<>"']/g,
    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])
  );

}


/* =========================================================
   启动
   ========================================================= */

function loadDeck(){

  if(deck.length !== 78){

    document.querySelector(
      "#loading div div:last-child"
    ).textContent =
      "牌库数量异常，请重新加载页面。";

    return;

  }

  /*
   * 检查第一张牌是否可以正常读取。
   */

  const testImage =
    new Image();

  testImage.onload = () => {

    $("loading")
      .classList
      .add("hidden");

    updateStats();

  };


  testImage.onerror = () => {

    /*
     * 图片测试失败也不阻止网页进入。
     * 这样即使浏览器缓存了旧资源，
     * 也不会再次出现“牌库加载失败”。
     */

    $("loading")
      .classList
      .add("hidden");

    updateStats();

  };


  testImage.src =
    deck[0].image;

}


/* =========================================================
   选牌
   ========================================================= */

function renderTable(){

  const table =
    $("table");

  table.innerHTML = "";


  deck.forEach((card,index) => {

    const button =
      document.createElement("button");

    button.className =
      "cardback" +
      (
        selected.includes(index)
          ? " selected"
          : ""
      );


    button.setAttribute(
      "aria-label",
      "第 " + (index + 1) + " 张牌"
    );


    button.onclick = () => {

      if(
        selected.includes(index)
      ){

        selected =
          selected.filter(
            x => x !== index
          );

      }else{

        selected.push(index);

      }


      renderTable();

    };


    table.appendChild(button);

  });


  $("selectedCount").textContent =
    selected.length;

}


function start(){

  selected = [];

  revealed = [];

  currentReading = null;

  renderTable();

  show("select");

}


/* =========================================================
   确认选牌
   ========================================================= */

function confirmSelection(){

  if(selected.length === 0){

    alert(
      "先选至少 1 张牌。"
    );

    return;

  }


  revealed =
    selected.map(index => ({

      card:deck[index],

      orientation:null,

      revealed:false

    }));


  currentReading = {

    startedAt:
      new Date().toISOString(),

    cards:revealed

  };


  $("revealCount").textContent =
    revealed.length;


  renderReveal();

  show("reveal");

}


/* =========================================================
   翻牌
   ========================================================= */

function renderReveal(){

  const grid =
    $("revealedGrid");

  grid.innerHTML = "";


  revealed.forEach((item,index) => {

    const cardBox =
      document.createElement("div");


    cardBox.className =
      "drawn-card" +
      (
        item.orientation === "reversed"
          ? " reversed"
          : ""
      );


    if(item.revealed){

      cardBox.innerHTML = `

        <img
          src="${item.card.image}"
          alt="${esc(item.card.name)}"
          loading="lazy"
        >

        <div class="card-name">
          ${esc(item.card.name)}
        </div>

        <div class="orientation">
          ${
            item.orientation === "reversed"
              ? "逆位"
              : "正位"
          }
        </div>

      `;


      cardBox.onclick = () =>
        flip(index);

    }else{

      cardBox.innerHTML = `

        <button
          class="cardback"
          style="width:100%"
          aria-label="翻开第 ${index + 1} 张牌"
        ></button>

        <div class="flip-hint">
          点击翻牌
        </div>

      `;


      cardBox.onclick = () =>
        flip(index);

    }


    grid.appendChild(cardBox);

  });

}


function flip(index){

  if(
    revealed[index].revealed
  ){

    return;

  }


  revealed[index].orientation =
    Math.random() < 0.5
      ? "upright"
      : "reversed";


  revealed[index].revealed =
    true;


  renderReveal();

}


function revealAll(){

  revealed.forEach(item => {

    if(!item.revealed){

      item.orientation =
        Math.random() < 0.5
          ? "upright"
          : "reversed";

      item.revealed = true;

    }

  });


  renderReveal();

}


/* =========================================================
   保存
   ========================================================= */

function save(){

  if(
    !revealed.every(
      item => item.revealed
    )
  ){

    alert(
      "还有牌没有翻开。你可以点“全部翻开”，也可以逐张翻开。"
    );

    return;

  }


  const history =
    getHistory();


  const reading = {

    id:
      (
        crypto &&
        crypto.randomUUID
      )
        ? crypto.randomUUID()
        : String(Date.now()),

    date:
      new Date().toISOString(),

    question:
      $("question")
        .value
        .trim(),

    note:
      $("note")
        .value
        .trim(),

    cards:
      revealed.map(item => ({

        name:
          item.card.name,

        image:
          item.card.image,

        orientation:
          item.orientation

      }))

  };


  history.unshift(reading);

  setHistory(history);

  updateStats();


  $("question").value = "";

  $("note").value = "";


  alert("已保存。");


  show("home");

}


/* =========================================================
   历史记录
   ========================================================= */

function renderHistory(){

  const history =
    getHistory();

  const box =
    $("historyList");

  box.innerHTML = "";


  if(history.length === 0){

    box.innerHTML = `
      <div class="empty">
        还没有抽牌记录。<br>
        去抽第一组吧。
      </div>
    `;

    return;

  }


  history.forEach(
    (reading,index) => {

      const item =
        document.createElement("div");

      item.className =
        "history-item";


      const date =
        new Date(reading.date);


      const dateText =
        date.toLocaleString(
          "zh-CN",
          {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
          }
        );


      item.innerHTML = `

        <div class="history-head">

          <b>
            ${esc(
              reading.question ||
              "自由抽牌"
            )}
          </b>

          <span class="history-date">
            ${dateText}
          </span>

        </div>


        <div class="history-cards">

          ${reading.cards
            .map(card => `

              <span class="pill">

                ${esc(card.name)}
                ·
                ${
                  card.orientation === "reversed"
                    ? "逆位"
                    : "正位"
                }

              </span>

            `)
            .join("")
          }

        </div>


        ${
          reading.note
            ? `
              <div class="history-q">
                ${esc(
                  reading.note
                ).replace(
                  /\n/g,
                  "<br>"
                )}
              </div>
            `
            : ""
        }


        <div class="small-actions">

          <button
            class="secondary"
            data-open="${index}"
          >
            查看
          </button>

          <button
            class="secondary danger"
            data-delete="${index}"
          >
            删除
          </button>

        </div>

      `;


      box.appendChild(item);

    }
  );


  box
    .querySelectorAll(
      "[data-open]"
    )
    .forEach(button => {

      button.onclick = () =>
        openDetail(
          Number(
            button.dataset.open
          )
        );

    });


  box
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(button => {

      button.onclick = () => {

        if(
          confirm(
            "删除这条记录？"
          )
        ){

          const history =
            getHistory();


          history.splice(
            Number(
              button.dataset.delete
            ),
            1
          );


          setHistory(history);

          renderHistory();

          updateStats();

        }

      };

    });

}


/* =========================================================
   历史详情
   ========================================================= */

function openDetail(index){

  const reading =
    getHistory()[index];


  if(!reading){

    return;

  }


  $("detailContent").innerHTML = `

    <div class="history-date">

      ${new Date(
        reading.date
      ).toLocaleString("zh-CN")}

    </div>


    <h3>

      ${esc(
        reading.question ||
        "自由抽牌"
      )}

    </h3>


    <div class="revealed-grid">

      ${reading.cards
        .map(card => `

          <div
            class="drawn-card
              ${
                card.orientation === "reversed"
                  ? "reversed"
                  : ""
              }"
          >

            <img
              src="${card.image}"
              alt="${esc(card.name)}"
              loading="lazy"
            >

            <div class="card-name">
              ${esc(card.name)}
            </div>

            <div class="orientation">
              ${
                card.orientation === "reversed"
                  ? "逆位"
                  : "正位"
              }
            </div>

          </div>

        `)
        .join("")
      }

    </div>


    ${
      reading.note
        ? `
          <div class="form">

            <textarea readonly>${esc(
              reading.note
            )}</textarea>

          </div>
        `
        : ""
    }

  `;


  $("detailModal")
    .classList
    .add("show");

}


/* =========================================================
   按钮
   ========================================================= */

$("startBtn").onclick =
  start;


$("historyBtn").onclick = () => {

  renderHistory();

  show("history");

};


$("backHome").onclick =
  () => show("home");


$("backFromHistory").onclick =
  () => show("home");


$("clearSelection").onclick = () => {

  selected = [];

  renderTable();

};


$("confirmSelection").onclick =
  confirmSelection;


$("backSelect").onclick =
  () => show("select");


$("revealAll").onclick =
  revealAll;


$("saveReading").onclick =
  save;


$("closeModal").onclick = () => {

  $("detailModal")
    .classList
    .remove("show");

};


$("detailModal").onclick = event => {

  if(
    event.target.id ===
    "detailModal"
  ){

    $("detailModal")
      .classList
      .remove("show");

  }

};


/* =========================================================
   启动
   ========================================================= */

loadDeck();

</script>

</body>
</html>
