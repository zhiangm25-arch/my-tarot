let state={spread:null,selected:[],revealed:new Set()};const $=id=>document.getElementById(id);const S=()=>SPREADS.find(x=>x.id===state.spread);function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeLabel(pos,i){let l=document.createElement('div');l.className='pos-label';l.textContent='第'+(i+1)+' · '+pos.label;return l}
function slot(pos,i,card,editable,revealMode=false){let e=document.createElement('div');e.className='slot'+(card?' filled':'');e.style.left=pos.x+'%';e.style.top=pos.y+'%';if(revealMode){e.classList.add('reveal-slot');e.dataset.index=i;let isOpen=state.revealed.has(i);e.innerHTML='<div class="slot-card '+(isOpen?'open':'')+'"><div class="slot-back">✦</div><div class="slot-front"><img src="'+card.img+'" alt="'+card.name+'"'+(card.reversed?' style="transform:rotate(180deg)"':'')+'></div></div>';e.onclick=(ev)=>{if(ev.target.closest('.pos-label'))return;let cardEl=e.querySelector('.slot-card');if(state.revealed.has(i)){state.revealed.delete(i);cardEl.classList.remove('open')}else{state.revealed.add(i);cardEl.classList.add('open')}}}else if(card){let im=document.createElement('img');im.src=card.img;im.alt=card.name;if(card.reversed)im.style.transform='rotate(180deg)';e.appendChild(im);if(card.reversed){let r=document.createElement('div');r.className='rev';r.textContent='↕';e.appendChild(r)}if(editable)e.onclick=()=>{state.selected.splice(i,1);renderSelect()}}else e.textContent='第'+(i+1)+'张';e.appendChild(makeLabel(pos,i));return e}
function renderStage(id,editable=false){let box=$(id);box.innerHTML='';S().positions.forEach((p,i)=>box.appendChild(slot(p,i,state.selected[i],editable,false)))}
function renderSpreads(){$('spreadList').innerHTML='';SPREADS.forEach(s=>{let b=document.createElement('button');b.className='spread-option';b.innerHTML='<div class="spread-name">'+s.name+'</div><div class="spread-count">'+s.count+' 张牌</div>';b.onclick=()=>{state.spread=s.id;state.selected=[];state.revealed=new Set();renderSelect();show('select')};$('spreadList').appendChild(b)})}
function renderDeck(){$('deckGrid').innerHTML='';let used=new Set(state.selected.map(x=>x.name));shuffle(deck).forEach(c=>{let b=document.createElement('button');b.className='cardback'+(used.has(c.name)?' selected':'');b.onclick=()=>{if(used.has(c.name)){state.selected.splice(state.selected.findIndex(x=>x.name===c.name),1)}else if(state.selected.length<S().count)state.selected.push({...c,reversed:Math.random()<.5});renderSelect();if(state.selected.length===S().count)setTimeout(openReveal,180)};$('deckGrid').appendChild(b)})}
function renderSelect(){$('selectTitle').textContent=S().name;$('selectProgress').textContent=state.selected.length+' / '+S().count;renderStage('selectStage',true);renderDeck()}
function openReveal(){state.revealed=new Set();renderReveal();show('reveal')}
function renderReveal(){$('revealTitle').textContent=S().name;$('revealNote').textContent='翻牌前，先看看每个位置代表什么。点击牌面即可翻开；位置意义会一直保留。';let box=$('revealStage');box.innerHTML='';S().positions.forEach((p,i)=>box.appendChild(slot(p,i,state.selected[i],false,true)));$('revealGrid').innerHTML=''}
function save(){let h=JSON.parse(localStorage.getItem('myTarotHistory')||'[]');h.unshift({date:new Date().toLocaleString('zh-CN'),spread:S().name,cards:state.selected.map((c,i)=>({label:S().positions[i].label,name:c.name,reversed:c.reversed}))});localStorage.setItem('myTarotHistory',JSON.stringify(h.slice(0,50)));$('saveBtn').textContent='已保存 ✓';setTimeout(()=>{$('saveBtn').textContent='保存记录'},1000)}function history(){let h=JSON.parse(localStorage.getItem('myTarotHistory')||'[]');$('historyList').innerHTML=h.length?h.map(x=>'<div class="history-item"><div class="history-date">'+x.date+'</div><div class="history-spread">'+x.spread+'</div><div class="history-cards">'+x.cards.map(c=>'<span class="pill">'+c.label+' · '+c.name+' · '+(c.reversed?'逆位':'正位')+'</span>').join('')+'</div></div>').join(''):'<div class="empty">还没有抽牌记录</div>'}
$('startBtn').onclick=()=>show('spreads');$('historyBtn').onclick=()=>{history();show('history')};$('homeTop').onclick=()=>show('home');$('spreadHome').onclick=()=>show('home');$('selectHome').onclick=()=>show('home');$('selectBack').onclick=()=>show('spreads');$('revealHome').onclick=()=>show('home');$('revealBack').onclick=()=>{renderSelect();show('select')};$('historyHome').onclick=()=>show('home');$('revealAll').onclick=async()=>{for(let i=0;i<S().positions.length;i++){if(state.revealed.has(i))continue;state.revealed.add(i);let cardEl=document.querySelector('.reveal-slot[data-index=\"'+i+'\"] .slot-card');if(cardEl){requestAnimationFrame(()=>cardEl.classList.add('open'))}await new Promise(r=>setTimeout(r,120))}};$('saveBtn').onclick=save;renderSpreads();
</script></body></html>
