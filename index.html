<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#17151b"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="MY TAROT"
>

<link
  rel="manifest"
  href="./manifest.json"
>

<link
  rel="apple-touch-icon"
  href="https://zhiangm25-arch.github.io/my-tarot/2325ED3E-F36C-495C-BC76-A8E3857AC2D8.png"
>

<title>MY TAROT</title>


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#111016;
  color:#eee9e2;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Helvetica Neue",
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none !important;
}


/* =========================
   APP
========================= */

#app{
  width:100%;
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(117,88,130,.14),
      transparent 38%
    ),
    #111016;
}

.view{
  width:100%;
  min-height:100vh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    18px
    calc(env(safe-area-inset-bottom) + 30px);
}

.view-inner{
  width:100%;
  max-width:680px;
  margin:0 auto;
}


/* =========================
   COMMON
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:26px;
}

.back-btn{
  color:#cdb58a;
  background:transparent;
  font-size:14px;
  padding:8px 0;
}

.top-title{
  font-size:15px;
  letter-spacing:.12em;
  color:#d8d0c5;
}

.spacer{
  width:45px;
}

.gold{
  color:#cdb58a;
}

.muted{
  color:#89838e;
}

.small{
  font-size:12px;
}

.divider{
  height:1px;
  background:rgba(205,181,138,.12);
  margin:20px 0;
}


/* =========================
   HOME
========================= */

.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:
    calc(
      100vh -
      env(safe-area-inset-top) -
      env(safe-area-inset-bottom)
    );
  padding-top:10vh;
}

.logo{
  width:68px;
  height:68px;
  border-radius:50%;
  border:1px solid rgba(205,181,138,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
  color:#cdb58a;
  font-size:25px;
  letter-spacing:.04em;
}

.home h1{
  margin:0;
  font-family:Georgia,serif;
  font-size:34px;
  font-weight:400;
  letter-spacing:.16em;
}

.home-sub{
  margin-top:13px;
  color:#918b95;
  font-size:13px;
  letter-spacing:.08em;
}

.home-question{
  margin-top:58px;
  color:#d9d1c8;
  font-size:17px;
}

.home-buttons{
  width:100%;
  max-width:330px;
  margin-top:26px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.primary-btn,
.secondary-btn{
  width:100%;
  height:50px;
  border-radius:8px;
  letter-spacing:.08em;
}

.primary-btn{
  background:#cdb58a;
  color:#19161b;
}

.secondary-btn{
  background:rgba(255,255,255,.035);
  color:#d8d0c5;
  border:1px solid rgba(205,181,138,.2);
}

.history-home{
  margin-top:26px;
  color:#817b85;
  background:none;
  font-size:13px;
}


/* =========================
   SELECTION
========================= */

.page-heading{
  margin-bottom:20px;
}

.page-heading h2{
  margin:0;
  font-size:24px;
  font-weight:400;
  letter-spacing:.08em;
}

.page-heading p{
  margin:10px 0 0;
  color:#85808a;
  font-size:13px;
  line-height:1.7;
}

.selection-count{
  text-align:center;
  color:#cdb58a;
  font-size:13px;
  margin:20px 0;
}

.deck-grid{
  display:grid;
  grid-template-columns:
    repeat(6,minmax(0,1fr));
  gap:7px;
}

.deck-card{
  position:relative;
  aspect-ratio:2 / 3.45;
  border-radius:6px;
  overflow:hidden;
  border:1px solid rgba(205,181,138,.15);
  background:
    radial-gradient(
      circle,
      rgba(205,181,138,.08),
      rgba(35,29,40,.95)
    );
  cursor:pointer;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.deck-card::before{
  content:"✦";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(205,181,138,.34);
  font-size:18px;
}

.deck-card.selected{
  border-color:#cdb58a;
  box-shadow:
    0 0 0 1px rgba(205,181,138,.25),
    0 5px 18px rgba(0,0,0,.3);
  transform:translateY(-3px);
}

.deck-card.selected::after{
  content:"✓";
  position:absolute;
  top:4px;
  right:4px;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#cdb58a;
  color:#19161b;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.selection-actions{
  position:sticky;
  bottom:0;
  padding:
    15px
    0
    calc(env(safe-area-inset-bottom) + 5px);
  background:
    linear-gradient(
      transparent,
      #111016 25%
    );
}

.selection-actions .primary-btn{
  box-shadow:0 -8px 22px rgba(17,16,22,.7);
}


/* =========================
   SPREAD LIST
========================= */

.spread-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.spread-item{
  width:100%;
  padding:17px 16px;
  text-align:left;
  color:#eee9e2;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(205,181,138,.12);
  border-radius:10px;
  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease;
}

.spread-item:active{
  transform:scale(.985);
}

.spread-item.selected{
  border-color:rgba(205,181,138,.55);
  background:rgba(205,181,138,.055);
}

.spread-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.spread-name{
  font-size:16px;
  letter-spacing:.05em;
}

.spread-count{
  flex:none;
  color:#cdb58a;
  font-size:11px;
  border:1px solid rgba(205,181,138,.25);
  border-radius:20px;
  padding:4px 8px;
}

.spread-category{
  margin-top:7px;
  font-size:11px;
  color:#7f7983;
}

.spread-description{
  margin-top:10px;
  color:#928c95;
  font-size:12px;
  line-height:1.65;
}

.spread-info{
  margin:18px 0;
  padding:17px;
  border-radius:10px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(205,181,138,.1);
}

.spread-info-title{
  color:#cdb58a;
  font-size:13px;
  margin-bottom:10px;
}

.spread-info p{
  margin:0;
  color:#938d96;
  font-size:12px;
  line-height:1.75;
}

.spread-start{
  margin-top:16px;
}


/* =========================
   SPREAD SELECT
========================= */

.special-note{
  padding:13px 15px;
  margin:14px 0 18px;
  border-left:2px solid #cdb58a;
  background:rgba(205,181,138,.035);
  color:#9b949d;
  font-size:12px;
  line-height:1.7;
}

.position-preview{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:15px 0;
}

.position-chip{
  border:1px solid rgba(205,181,138,.14);
  color:#85808a;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
}

.position-chip.active{
  border-color:rgba(205,181,138,.5);
  color:#cdb58a;
}


/* =========================
   REVEAL
========================= */

.reveal-header{
  margin-bottom:20px;
}

.reveal-spread-name{
  color:#cdb58a;
  font-size:12px;
  letter-spacing:.1em;
}

.reveal-header h2{
  margin:7px 0 0;
  font-size:24px;
  font-weight:400;
}

.reveal-progress{
  margin-top:8px;
  color:#77717b;
  font-size:11px;
}

.question-box{
  margin:18px 0 25px;
}

.input-label{
  display:block;
  color:#89838d;
  font-size:11px;
  margin-bottom:7px;
}

.input,
.textarea{
  width:100%;
  border:1px solid rgba(205,181,138,.13);
  background:rgba(255,255,255,.025);
  color:#eee9e2;
  border-radius:8px;
  outline:none;
  padding:11px 12px;
}

.textarea{
  min-height:80px;
  resize:vertical;
}

.input:focus,
.textarea:focus{
  border-color:rgba(205,181,138,.45);
}


/* =========================
   TAROT FLIP
========================= */

.tarot-flip{
  position:relative;
  width:100%;
  aspect-ratio:2 / 3.45;
  perspective:1100px;
  cursor:pointer;
}

.tarot-inner{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:
    transform .68s
    cubic-bezier(.22,.75,.25,1);
}

.tarot-flip.flipped
.tarot-inner{
  transform:rotateY(180deg);
}

.tarot-face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:9px;
  overflow:hidden;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.tarot-back{
  background:
    radial-gradient(
      circle at center,
      rgba(205,181,138,.12),
      transparent 38%
    ),
    #211c25;
  border:1px solid rgba(205,181,138,.35);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}

.tarot-back::before{
  content:"✦";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  color:rgba(205,181,138,.38);
}

.tarot-front{
  transform:rotateY(180deg);
  background:#201c22;
  border:1px solid rgba(205,181,138,.45);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}

.tarot-front img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .15s ease;
}

.tarot-front img.reversed{
  transform:rotate(180deg);
}


/* =========================
   CARD INFO
========================= */

.card-info{
  text-align:center;
  padding-top:12px;
  opacity:0;
  transform:translateY(5px);
  transition:
    opacity .35s ease,
    transform .35s ease;
}

.card-info.show{
  opacity:1;
  transform:translateY(0);
}

.position-number{
  color:#cdb58a;
  font-size:10px;
  letter-spacing:.12em;
}

.position-label{
  margin-top:4px;
  color:#bdb5ad;
  font-size:11px;
}

.card-name{
  margin-top:5px;
  font-family:Georgia,serif;
  color:#eee9e2;
  font-size:16px;
}

.orientation{
  margin-top:4px;
  color:#817b84;
  font-size:11px;
}


/* =========================
   GENERIC REVEAL GRID
========================= */

.reveal-layout{
  width:100%;
  margin:25px auto;
}


/* 默认 */

.layout-default{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:25px 12px;
}


/* 3张 */

.layout-triangle{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
}

.layout-triangle .reveal-card:nth-child(1){
  grid-column:1;
}

.layout-triangle .reveal-card:nth-child(2){
  grid-column:2;
}

.layout-triangle .reveal-card:nth-child(3){
  grid-column:3;
}


/* 4张 */

.layout-diamond{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
}

.layout-diamond .reveal-card:nth-child(1){
  grid-column:2;
}

.layout-diamond .reveal-card:nth-child(2){
  grid-column:1;
  grid-row:2;
}

.layout-diamond .reveal-card:nth-child(3){
  grid-column:3;
  grid-row:2;
}

.layout-diamond .reveal-card:nth-child(4){
  grid-column:2;
  grid-row:3;
}


/* 5张 */

.layout-cross{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
}

.layout-cross .reveal-card:nth-child(1){
  grid-column:2;
  grid-row:1;
}

.layout-cross .reveal-card:nth-child(2){
  grid-column:1;
  grid-row:2;
}

.layout-cross .reveal-card:nth-child(3){
  grid-column:2;
  grid-row:2;
}

.layout-cross .reveal-card:nth-child(4){
  grid-column:3;
  grid-row:2;
}

.layout-cross .reveal-card:nth-child(5){
  grid-column:2;
  grid-row:3;
}


/* 6张 */

.layout-six{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:18px 10px;
}


/* 7张 */

.layout-seven{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:18px 10px;
}

.layout-seven .reveal-card:nth-child(7){
  grid-column:2;
}


/* 8张 */

.layout-eight{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:18px 8px;
}


/* 9张 */

.layout-nine{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:18px 10px;
}


/* 10张 */

.layout-ten{
  display:grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap:16px 7px;
}


/* 11张 / 时间金字塔 */

.layout-pyramid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:17px 8px;
}

.layout-pyramid .reveal-card:nth-child(-n+4){
  grid-row:1;
}

.layout-pyramid .reveal-card:nth-child(n+5):nth-child(-n+7){
  grid-row:2;
}

.layout-pyramid .reveal-card:nth-child(n+8):nth-child(-n+9){
  grid-row:3;
}

.layout-pyramid .reveal-card:nth-child(10){
  grid-column:2 / span 2;
  grid-row:4;
}

.layout-pyramid .reveal-card:nth-child(11){
  grid-column:1 / span 4;
  grid-row:5;
  max-width:90px;
  justify-self:center;
}


/* 12张生命之树 */

.layout-tree{
  position:relative;
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:16px 8px;
}

.layout-tree .reveal-card:nth-child(1){
  grid-column:2 / span 2;
}

.layout-tree .reveal-card:nth-child(2){
  grid-column:1;
}

.layout-tree .reveal-card:nth-child(3){
  grid-column:2;
}

.layout-tree .reveal-card:nth-child(4){
  grid-column:3;
}

.layout-tree .reveal-card:nth-child(5){
  grid-column:4;
}

.layout-tree .reveal-card:nth-child(6){
  grid-column:1;
}

.layout-tree .reveal-card:nth-child(7){
  grid-column:2;
}

.layout-tree .reveal-card:nth-child(8){
  grid-column:3;
}

.layout-tree .reveal-card:nth-child(9){
  grid-column:4;
}

.layout-tree .reveal-card:nth-child(10){
  grid-column:2 / span 2;
}

.layout-tree .reveal-card:nth-child(11){
  grid-column:1 / span 4;
  max-width:90px;
  justify-self:center;
}

.layout-tree .reveal-card:nth-child(12){
  grid-column:1 / span 4;
  max-width:90px;
  justify-self:center;
}


/* 13张黄道 */

.layout-zodiac{
  position:relative;
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:14px 8px;
}

.layout-zodiac .reveal-card:nth-child(13){
  grid-column:2 / span 2;
}


/* =========================
   SPECIAL SPREAD DECORATION
========================= */

.spread-layout-title{
  text-align:center;
  margin:4px 0 18px;
  color:#625c66;
  font-size:10px;
  letter-spacing:.12em;
}


/* =========================
   REVEAL ACTIONS
========================= */

.reveal-actions{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.secondary-small{
  width:100%;
  height:45px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(205,181,138,.15);
  color:#aaa2aa;
  border-radius:8px;
}

.save-btn{
  width:100%;
  height:48px;
  background:#cdb58a;
  color:#19161b;
  border-radius:8px;
}

.save-btn:disabled{
  opacity:.3;
}


/* =========================
   HISTORY
========================= */

.history-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.history-item{
  padding:15px;
  border-radius:9px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(205,181,138,.1);
}

.history-date{
  font-size:10px;
  color:#77717b;
}

.history-spread{
  margin-top:6px;
  color:#cdb58a;
  font-size:13px;
}

.history-question{
  margin-top:6px;
  color:#aaa3aa;
  font-size:12px;
  line-height:1.5;
}

.history-cards{
  margin-top:10px;
  color:#77717b;
  font-size:11px;
  line-height:1.6;
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.65);
  padding:15px;
}

.modal-content{
  width:100%;
  max-width:620px;
  max-height:85vh;
  overflow:auto;
  border-radius:14px 14px 0 0;
  background:#19171d;
  border:1px solid rgba(205,181,138,.14);
  padding:22px 18px;
}

.modal-title{
  color:#cdb58a;
  font-size:16px;
  margin-bottom:15px;
}

.modal-close{
  width:100%;
  height:44px;
  margin-top:20px;
  background:rgba(255,255,255,.04);
  color:#aaa3ab;
  border-radius:8px;
}

.detail-position{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.detail-position-number{
  color:#cdb58a;
  font-size:11px;
}

.detail-position-name{
  margin-top:3px;
  color:#ddd6ce;
  font-size:13px;
}

.detail-card{
  margin-top:4px;
  color:#89828c;
  font-size:11px;
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:
    calc(
      env(safe-area-inset-bottom) + 25px
    );
  transform:translate(-50%,15px);
  z-index:200;
  background:#2a2630;
  color:#ddd5cc;
  border:1px solid rgba(205,181,138,.18);
  border-radius:20px;
  padding:9px 15px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:
    opacity .25s ease,
    transform .25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:420px){

  .deck-grid{
    gap:5px;
  }

  .layout-eight{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .layout-eight .reveal-card:nth-child(7),
  .layout-eight .reveal-card:nth-child(8){
    grid-column:auto;
  }

  .layout-ten{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .layout-ten .reveal-card:nth-child(10){
    grid-column:2;
  }

  .layout-pyramid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .layout-pyramid .reveal-card:nth-child(10){
    grid-column:1 / span 3;
  }

  .layout-pyramid .reveal-card:nth-child(11){
    grid-column:1 / span 3;
  }

  .layout-tree,
  .layout-zodiac{
    grid-template-columns:

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function showView(id){

  document
    .querySelectorAll(".view")
    .forEach(view => {
      view.classList.add("hidden");
    });

  $(id).classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}


function shuffle(array){

  const arr = [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];
  }

  return arr;
}


function wait(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}


function showToast(message){

  const toast = $("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => toast.classList.remove("show"),
      1800
    );
}

function renderFreeDeck(){

  const grid = $("freeDeckGrid");

  grid.innerHTML = "";

  DECK.forEach(
    (card,index) => {

        document.createElement("div");

      el.className =

function toggleFreeCard(index){

  const existing =
    selectedIndices.indexOf(index);

  if(existing >= 0){

    selectedIndices.splice(
      existing,

  }else{

    selectedIndices.push(index);

  renderFreeDeck();
}

/* =========================================================
   SPECIAL SPREAD
========================================================= */

function isAutoSpread(){

  return currentSpread &&
    (
      currentSpread.special === "cat" ||
      currentSpread.special === "birth"
    );
}


function drawSpecialSpread(){

  const shuffled =
    shuffle(DECK);

  if(
    currentSpread.special === "cat"
  ){

    /*
      原牌阵规则：
      取洗牌后第7～12张。
      数组从0开始，因此为6～11。
    */

    return shuffled.slice(6,12);

  }

  if(
    currentSpread.special === "birth"
  ){

    /*
      原牌阵规则：
      第7～19张。
    */

    return shuffled.slice(6,19);

  }

  return [];
}


/* =========================================================
   COURT CARDS
========================================================= */

function getCourtCards(){

  return DECK.filter(
    card =>
      card.name.includes("侍者") ||
      card.name.includes("骑士") ||
      card.name.includes("皇后") ||
      card.name.includes("国王")
  );

}


function courtRank(card){

  if(card.name.includes("侍者"))
    return "page";

  if(card.name.includes("骑士"))
    return "knight";

  if(card.name.includes("皇后"))
    return "queen";

  if(card.name.includes("国王"))
    return "king";

  return "";
}

function renderPositionPreview(){

      (position,index) => {

      }

function renderSpreadDeck(){

  const grid =
    $("spreadDeckGrid");

  grid.innerHTML = "";

  let availableDeck =
    DECK;

  if(
    currentSpread.special === "court"
  ){
    availableDeck =
      getCourtCards();
  }

  availableDeck.forEach(
    card => {

      const originalIndex =
        DECK.findIndex(
          d =>
            d.code === card.code &&
            d.name === card.name
        );

      const el =
        document.createElement("div");

      el.className =
        "deck-card";

      el.dataset.index =
        originalIndex;

      if(
        selectedIndices.includes(
          originalIndex
        )
      ){
        el.classList.add("selected");
      }

      el.onclick =
        () =>
          toggleSpreadCard(
            originalIndex
          );

      grid.appendChild(el);

    }
  );
}


function toggleSpreadCard(index){

  if(
    currentSpread.special === "court"
  ){

    const rank =
      courtRank(DECK[index]);

    const already =
      selectedIndices.findIndex(
        i =>
          courtRank(DECK[i]) === rank
      );

    if(already >= 0){

      selectedIndices.splice(
        already,
        1
      );

    }else{

      if(
        selectedIndices.length >= 4
      ){
        showToast(
          "宫廷仪仗牌阵需要一张侍者、一张骑士、一张皇后和一张国王"
        );
        return;
      }

      selectedIndices.push(index);

    }

  }else{

    const existing =
      selectedIndices.indexOf(index);

    if(existing >= 0){

      selectedIndices.splice(
        existing,
        1
      );

    }else{

      if(
        selectedIndices.length >=
        currentSpread.count
      ){
        showToast(
          `这个牌阵需要 ${currentSpread.count} 张牌`
        );
        return;
      }

      selectedIndices.push(index);

    }

  }

  renderSpreadDeck();

  updateSpreadCount();

  renderPositionPreview();
}


function updateSpreadCount(){

  const count =
    selectedIndices.length;

  const total =
    currentSpread.count;

  $("spreadSelectionCount")
    .textContent =
      `已选择 ${count} / ${total} 张`;

  let valid =
    count === total;

  if(
    currentSpread.special === "court"
  ){

    const ranks =
      selectedIndices.map(
        i => courtRank(DECK[i])
      );

    valid =
      count === 4 &&
      ["page","knight","queen","king"]
        .every(
          rank =>
            ranks.includes(rank)
        );

  }

  $("confirmSpreadBtn")
    .disabled =
      !valid;

}


function confirmSpreadSelection(){

  if(
    isAutoSpread()
  ){

    const cards =
      drawSpecialSpread();

    readingCards =
      cards.map(
        card => ({
          ...card,
          orientation:null,
          revealed:false
        })
      );

  }else{

    if(
      selectedIndices.length !==
      currentSpread.count
    ){

      showToast(
        `请先选择 ${currentSpread.count} 张牌`
      );

      return;
    }

    let orderedIndices =
      [...selectedIndices];

    if(
      currentSpread.special === "court"
    ){

      const order =
        {
          page:0,
          knight:1,
          queen:2,
          king:3
        };

      orderedIndices.sort(
        (a,b) =>
          order[courtRank(DECK[a])] -
          order[courtRank(DECK[b])]
      );

    }

    readingCards =
      orderedIndices.map(
        index => ({
          ...DECK[index],
          orientation:null,
          revealed:false
        })
      );

  }

  revealed =
    readingCards.map(() => false);

  renderReveal();

  showView("revealView");
}


/* =========================================================
   REVEAL
========================================================= */

function getRevealLayout(){

  if(
    currentMode !== "spread" ||
    !currentSpread
  ){
    return "layout-default";
  }

  switch(currentSpread.layout){

    case "triangle":
      return "layout-triangle";

    case "diamond":
      return "layout-diamond";

    case "cross":
      return "layout-cross";

    case "six":
      return "layout-six";

    case "seven":
      return "layout-seven";

    case "eight":
      return "layout-eight";

    case "nine":
      return "layout-nine";

    case "ten":
      return "layout-ten";

    case "pyramid":
      return "layout-pyramid";

    case "tree":
      return "layout-tree";

    case "zodiac":
      return "layout-zodiac";

    default:
      return "layout-default";

  }

}


function renderReveal(){

  const layout =
    $("revealCards");

  layout.className =
    `reveal-layout ${getRevealLayout()}`;

  layout.innerHTML = "";

  $("revealSpreadName")
    .textContent =
      currentMode === "spread" &&
      currentSpread
        ? currentSpread.name
        : "自由抽牌";

  if(
    currentMode === "spread" &&
    currentSpread
  ){

    $("revealLayoutTitle")
      .textContent =
        currentSpread.description;

    $("revealLayoutTitle")
      .classList.remove("hidden");

  }else{

    $("revealLayoutTitle")
      .classList.add("hidden");

  }

  readingCards.forEach(
    (card,index) => {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "reveal-card";

      const flip =
        document.createElement("div");

      flip.className =
        "tarot-flip";

      flip.dataset.index =
        index;

      const inner =
        document.createElement("div");

      inner.className =
        "tarot-inner";


      const back =
        document.createElement("div");

      back.className =
        "tarot-face tarot-back";


      const front =
        document.createElement("div");

      front.className =
        "tarot-face tarot-front";


      const img =
        document.createElement("img");

      img.src =
        `./${card.code}.jpg`;

      img.alt =
        card.name;


      front.appendChild(img);

      inner.appendChild(back);
      inner.appendChild(front);

      flip.appendChild(inner);

      flip.onclick =
        () => flipCard(index);


      const info =
        document.createElement("div");

      info.className =
        "card-info";

      info.id =
        `cardInfo-${index}`;


      let positionLabel =
        "";

      if(
        currentMode === "spread" &&
        currentSpread
      ){

        positionLabel =
          currentSpread
            .positions[index][0];

      }


      info.innerHTML = `

        ${
          currentMode === "spread"
            ? `
              <div class="position-number">
                ${index + 1}
              </div>

              <div class="position-label">
                ${positionLabel}
              </div>
            `
            : ""
        }

        <div class="card-name">
          ${card.name}
        </div>

        <div
          id="orientation-${index}"
          class="orientation"
        >
        </div>

      `;


      wrapper.appendChild(flip);

      wrapper.appendChild(info);

      layout.appendChild(wrapper);

    }
  );

  updateRevealProgress();
}


function flipCard(index){

  if(
    !readingCards[index] ||
    readingCards[index].revealed
  ){
    return;
  }

  const card =
    readingCards[index];

  card.orientation =
    Math.random() < .5
      ? "upright"
      : "reversed";

  card.revealed = true;

  revealed[index] = true;


  const flip =
    document.querySelector(
      `.tarot-flip[data-index="${index}"]`
    );

  if(!flip){
    return;
  }


  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      flip.classList.add("flipped");

    });

  });


  const orientation =
    $(`orientation-${index}`);

  orientation.textContent =
    card.orientation === "upright"
      ? "正位"
      : "逆位";


  const cardImage =
    flip.querySelector("img");

  if(
    card.orientation === "reversed"
  ){

    cardImage.classList.add("reversed");

  }


  const info =
    $(`cardInfo-${index}`);

  setTimeout(
    () => info.classList.add("show"),
    430
  );


  updateRevealProgress();
}


async function revealAll(){

  for(
    let i = 0;
    i < readingCards.length;
    i++
  ){

    if(
      !readingCards[i].revealed
    ){

      flipCard(i);

      await wait(210);

    }

  }

}


function updateRevealProgress(){

  const total =
    readingCards.length;

  const count =
    readingCards.filter(
      card => card.revealed
    ).length;

  $("revealProgress")
    .textContent =
      `${count} / ${total} 张已翻开`;

  $("saveBtn").disabled =
    count !== total;
}

/* =========================================================
   SAVE
========================================================= */

function saveReading(){

  const allRevealed =
    readingCards.every(
      card => card.revealed
    );

  if(!allRevealed){

    showToast(
      "请先翻开全部牌"
    );

    return;
  }


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const record = {

    id:Date.now(),

    date:
      new Date().toISOString(),

    question:
      $("questionInput")
        .value
        .trim(),

    note:
      $("noteInput")
        .value
        .trim(),

    spreadId:
      currentMode === "spread" &&
      currentSpread
        ? currentSpread.id
        : null,

    spreadName:
      currentMode === "spread" &&
      currentSpread
        ? currentSpread.name
        : "自由抽牌",

    cards:
      readingCards.map(
        card => ({
          name:card.name,
          code:card.code,
          orientation:card.orientation
        })
      ),

    positions:
      currentMode === "spread" &&
      currentSpread
        ? readingCards.map(
            (card,index) => ({
              number:index + 1,
              label:
                currentSpread
                  .positions[index][0],
              name:card.name,
              code:card.code,
              orientation:
                card.orientation
            })
          )
        : []

  };


  history.unshift(record);


  localStorage.setItem(
    "myTarotHistory",
    JSON.stringify(history)
  );


  showToast(
    "已经保存到抽牌记录"
  );

}


/* =========================================================
   HISTORY
========================================================= */

function openHistory(){

  renderHistory();

  showView("historyView");

}


function renderHistory(){

  const list =
    $("historyList");

  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  if(history.length === 0){

    list.innerHTML = `

      <div
        class="muted"
        style="
          text-align:center;
          padding:60px 20px;
          line-height:1.8;
        "
      >
        还没有抽牌记录
      </div>

    `;

    return;
  }


  list.innerHTML = "";


  history.forEach(
    record => {

      const item =
        document.createElement("button");

      item.className =
        "history-item";

      item.innerHTML = `

        <div class="history-date">
          ${formatDate(record.date)}
        </div>

        <div class="history-spread">
          ${record.spreadName || "自由抽牌"}
        </div>

        ${
          record.question
            ? `
              <div class="history-question">
                ${escapeHtml(record.question)}
              </div>
            `
            : ""
        }

        <div class="history-cards">
          ${record.cards
            .map(
              (card,index) =>
                `${
                  record.positions &&
                  record.positions[index]
                    ? record.positions[index].number + ". "
                    : ""
                }${card.name} ${
                  card.orientation === "reversed"
                    ? "逆位"
                    : "正位"
                }`
            )
            .join("　")}
        </div>

      `;


      item.onclick =
        () =>
          openHistoryDetail(record);


      list.appendChild(item);

    }
  );

}


function formatDate(date){

  const d =
    new Date(date);

  return (
    d.getFullYear() +
    " / " +
    String(
      d.getMonth() + 1
    ).padStart(2,"0") +
    " / " +
    String(
      d.getDate()
    ).padStart(2,"0") +
    "  " +
    String(
      d.getHours()
    ).padStart(2,"0") +
    ":" +
    String(
      d.getMinutes()
    ).padStart(2,"0")
  );

}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function openHistoryDetail(record){

  $("modalTitle")
    .textContent =
      record.spreadName || "自由抽牌";


  let html = "";


  if(record.question){

    html += `

      <div
        style="
          color:#aaa3ab;
          font-size:12px;
          line-height:1.7;
          margin-bottom:16px;
        "
      >
        ${escapeHtml(record.question)}
      </div>

    `;

  }


  if(record.note){

    html += `

      <div
        style="
          color:#77717b;
          font-size:11px;
          line-height:1.7;
          margin-bottom:18px;
        "
      >
        ${escapeHtml(record.note)}
      </div>

    `;

  }


  record.cards.forEach(
    (card,index) => {

      const position =
        record.positions &&
        record.positions[index];


      html += `

        <div class="detail-position">

          ${
            position
              ? `
                <div class="detail-position-number">
                  ${position.number}
                </div>

                <div class="detail-position-name">
                  ${escapeHtml(position.label)}
                </div>
              `
              : ""
          }

          <div class="detail-card">
            ${escapeHtml(card.name)}
            ·
            ${
              card.orientation === "reversed"
                ? "逆位"
                : "正位"
            }
          </div>

        </div>

      `;

    }
  );


  $("modalBody").innerHTML =
    html;

  $("historyModal")
    .classList.remove("hidden");

}


function closeHistoryModal(){

  $("historyModal")
    .classList.add("hidden");

}


/* =========================================================
   INIT
========================================================= */

showView("homeView");

</script>
