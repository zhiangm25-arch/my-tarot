<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#17151b">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="MY TAROT"
>

<link rel="manifest" href="./manifest.json">

<link
  rel="apple-touch-icon"
  href="https://zhiangm25-arch.github.io/my-tarot/2325ED3E-F36C-495C-BC76-A8E3857AC2D8.png"
>

<title>MY TAROT</title>


<style>

/* =========================================================
   基础
========================================================= */

:root{
  --bg:#111016;
  --panel:#17151b;
  --panel2:#1d1a21;
  --gold:#cdb58a;
  --gold2:#e1cfaa;
  --text:#eee8df;
  --muted:#918a82;
  --line:rgba(205,181,138,.20);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  outline:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding:
    env(safe-area-inset-top)
    18px
    env(safe-area-inset-bottom);
}

.page{
  width:100%;
  max-width:680px;
  margin:0 auto;
  min-height:100vh;
}

.hidden{
  display:none !important;
}


/* =========================================================
   顶部
========================================================= */

.header{
  padding-top:28px;
  text-align:center;
}

.logo{
  color:var(--gold2);
  font-size:25px;
  font-weight:500;
  letter-spacing:.24em;
  margin-left:.24em;
}

.subtitle{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.12em;
}


/* =========================================================
   首页
========================================================= */

.home-content{
  min-height:calc(100vh - 110px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding-bottom:70px;
}

.home-symbol{
  width:82px;
  height:108px;
  border:1px solid rgba(205,181,138,.42);
  border-radius:11px;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:31px;
  margin-bottom:30px;
  box-shadow:0 0 40px rgba(205,181,138,.06);
}

.home-question{
  font-size:22px;
  letter-spacing:.08em;
  color:#eee8df;
  margin-bottom:11px;
}

.home-hint{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.06em;
  margin-bottom:34px;
}

.home-buttons{
  width:100%;
  max-width:330px;
  display:flex;
  flex-direction:column;
  gap:11px;
}

.primary-btn{
  width:100%;
  padding:14px 26px;
  border-radius:30px;
  background:
    linear-gradient(
      135deg,
      #d8c49c,
      #b69c6e
    );
  color:#211c17;
  font-size:14px;
  letter-spacing:.08em;
  box-shadow:0 7px 25px rgba(205,181,138,.12);
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.primary-btn:active{
  transform:scale(.96);
  box-shadow:0 3px 12px rgba(205,181,138,.08);
}

.spread-home-btn{
  width:100%;
  padding:13px 20px;
  border-radius:30px;
  border:1px solid rgba(205,181,138,.32);
  background:rgba(205,181,138,.04);
  color:var(--gold2);
  font-size:13px;
  letter-spacing:.08em;
}

.text-btn{
  background:none;
  color:var(--muted);
  font-size:12px;
  padding:8px;
}

.text-btn:active{
  color:var(--gold2);
}


/* =========================================================
   通用页面
========================================================= */

.page-title{
  margin-top:38px;
  text-align:center;
  font-size:18px;
  font-weight:400;
  letter-spacing:.10em;
}

.page-description{
  margin-top:9px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:25px;
}


/* =========================================================
   牌阵列表
========================================================= */

.spread-list{
  margin-top:25px;
  padding-bottom:35px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.spread-card{
  width:100%;
  padding:17px 16px;
  border:1px solid rgba(205,181,138,.17);
  border-radius:12px;
  background:#17151b;
  color:var(--text);
  text-align:left;
  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease;
}

.spread-card:active{
  transform:scale(.985);
  background:#1b181f;
}

.spread-card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.spread-name{
  color:#eee8df;
  font-size:15px;
}

.spread-count{
  color:var(--gold);
  font-size:10px;
  flex:none;
}

.spread-category{
  margin-top:7px;
  color:#9c9288;
  font-size:10px;
  letter-spacing:.08em;
}

.spread-description{
  margin-top:8px;
  color:#aaa3ad;
  font-size:12px;
  line-height:1.65;
}


/* =========================================================
   牌阵说明
========================================================= */

.spread-start-info{
  margin-top:25px;
  padding:18px;
  border:1px solid rgba(205,181,138,.17);
  border-radius:12px;
  background:#17151b;
}

.spread-start-name{
  color:var(--gold2);
  text-align:center;
  font-size:17px;
}

.spread-start-category{
  margin-top:7px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
}

.spread-start-description{
  margin-top:15px;
  color:#b7afb6;
  font-size:12px;
  line-height:1.8;
}

.spread-start-rule{
  margin-top:13px;
  padding:11px 12px;
  border-radius:8px;
  background:rgba(205,181,138,.05);
  color:#bba987;
  font-size:11px;
  line-height:1.7;
}

.spread-start-actions{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}


/* =========================================================
   牌阵视觉预览
========================================================= */

.spread-visual-title{
  margin-top:24px;
  color:#aaa3ad;
  text-align:center;
  font-size:10px;
  letter-spacing:.10em;
}

.spread-visual{
  position:relative;
  width:100%;
  height:270px;
  margin-top:10px;
  border:1px solid rgba(205,181,138,.13);
  border-radius:14px;
  background:
    radial-gradient(
      circle at center,
      rgba(205,181,138,.045),
      transparent 62%
    ),
    #141218;
  overflow:hidden;
}

.visual-card{
  position:absolute;
  width:46px;
  height:70px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(205,181,138,.36);
  border-radius:6px;
  background:
    radial-gradient(
      circle at center,
      rgba(205,181,138,.12),
      transparent 58%
    ),
    linear-gradient(
      145deg,
      #29242f,
      #17151b
    );
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 5px 18px rgba(0,0,0,.24);
}

.visual-card::before{
  content:"✦";
  width:22px;
  height:31px;
  border:1px solid rgba(205,181,138,.30);
  border-radius:4px;
  display:grid;
  place-items:center;
  color:rgba(205,181,138,.55);
  font-size:10px;
}

.visual-number{
  position:absolute;
  top:3px;
  left:5px;
  color:rgba(225,207,170,.68);
  font-size:8px;
}

.visual-label{
  position:absolute;
  left:50%;
  top:calc(100% + 5px);
  transform:translateX(-50%);
  width:80px;
  text-align:center;
  color:#aaa09a;
  font-size:8px;
  line-height:1.3;
}

.visual-card.significator{
  border-color:rgba(225,207,170,.65);
  box-shadow:
    0 0 18px rgba(205,181,138,.10),
    0 5px 18px rgba(0,0,0,.24);
}


/* =========================================================
   选择牌
========================================================= */

.select-top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:25px;
}

.select-top-left{
  justify-self:start;
}

.select-top-center{
  justify-self:center;
}

.select-top-right{
  justify-self:end;
}

.select-count{
  color:var(--gold2);
  font-size:12px;
}

.select-mode-label{
  color:var(--muted);
  font-size:10px;
}

.secondary-btn{
  padding:10px 15px;
  border-radius:22px;
  border:1px solid rgba(205,181,138,.30);
  background:#211d24;
  color:var(--gold2);
  font-size:12px;
  letter-spacing:.04em;
  transition:
    background .18s ease,
    border-color .18s ease,
    transform .15s ease;
}

.secondary-btn:active{
  transform:scale(.96);
  background:#29232d;
}

.select-home-btn{
  width:100%;
  margin-top:15px;
  padding:12px;
  border-radius:24px;
  border:1px solid rgba(205,181,138,.20);
  background:transparent;
  color:#8f887f;
  font-size:12px;
  letter-spacing:.05em;
}

.select-home-btn:active{
  color:var(--gold2);
  border-color:rgba(205,181,138,.42);
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
  margin-top:20px;
  padding-bottom:30px;
}

@media(max-width:390px){
  .card-grid{
    grid-template-columns:repeat(5,1fr);
    gap:9px;
  }
}

.select-card{
  position:relative;
  aspect-ratio:2 / 3.45;
  perspective:900px;
  cursor:pointer;
}

.select-card-inner{
  position:absolute;
  inset:0;
  border-radius:7px;
  border:1px solid rgba(205,181,138,.18);
  background:
    radial-gradient(
      circle at center,
      rgba(205,181,138,.12),
      transparent 55%
    ),
    linear-gradient(
      145deg,
      #27222d,
      #17151b
    );
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:
    transform .22s ease,
    border-color .22s ease,
    box-shadow .22s ease;
}

.select-card-inner::before{
  content:"✦";
  color:rgba(205,181,138,.35);
  font-size:14px;
}

.select-card.selected .select-card-inner{
  transform:
    translateY(-4px)
    scale(.96);
  border-color:rgba(225,207,170,.8);
  box-shadow:
    0 7px 20px
    rgba(205,181,138,.14);
}

.select-card.selected::after{
  content:"✓";
  position:absolute;
  right:4px;
  top:4px;
  width:17px;
  height:17px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--gold2);
  color:#211c17;
  font-size:10px;
  font-weight:bold;
}


/* =========================================================
   选择页面底部
========================================================= */

.select-bottom{
  position:sticky;
  bottom:0;
  padding:
    14px
    0
    calc(14px + env(safe-area-inset-bottom));
  background:
    linear-gradient(
      to bottom,
      rgba(17,16,22,0),
      rgba(17,16,22,.95) 30%
    );
  text-align:center;
}

.confirm-btn{
  width:100%;
  max-width:330px;
  padding:14px;
  border-radius:28px;
  background:
    linear-gradient(
      135deg,
      #d8c49c,
      #b69c6e
    );
  color:#211c17;
  font-size:14px;
  letter-spacing:.08em;
}

.confirm-btn:disabled{
  opacity:.35;
}


/* =========================================================
   翻牌页面
========================================================= */

.reveal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:30px;
}

.reveal-progress{
  color:var(--muted);
  font-size:12px;
}

.reveal-spread-name{
  margin-top:18px;
  text-align:center;
  color:var(--gold2);
  font-size:14px;
  letter-spacing:.08em;
}

.reveal-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
  margin-top:28px;
  padding-bottom:20px;
}

@media(max-width:390px){
  .reveal-grid{
    gap:12px;
  }
}


/* =========================================================
   真正的 3D 翻牌
========================================================= */

.tarot-flip{
  position:relative;
  width:100%;
  aspect-ratio:2 / 3.45;
  perspective:1100px;
  cursor:pointer;
}

.tarot-inner{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:
    transform .68s
    cubic-bezier(.22,.75,.25,1);
}

.tarot-flip.flipped .tarot-inner{
  transform:rotateY(180deg);
}

.tarot-face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:9px;
  overflow:hidden;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.tarot-back{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at center,
      rgba(205,181,138,.10),
      transparent 55%
    ),
    linear-gradient(
      145deg,
      #27222d,
      #141319
    );
  border:1px solid rgba(205,181,138,.34);
  box-shadow:0 8px 25px rgba(0,0,0,.22);
}

.tarot-back::before{
  content:"✦";
  width:34px;
  height:48px;
  border:1px solid rgba(205,181,138,.45);
  border-radius:5px;
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:16px;
  box-shadow:inset 0 0 15px rgba(205,181,138,.05);
}

.tarot-back::after{
  content:"点击翻牌";
  position:absolute;
  bottom:9px;
  left:0;
  right:0;
  text-align:center;
  color:rgba(225,207,170,.45);
  font-size:9px;
  letter-spacing:.05em;
}

.tarot-front{
  transform:rotateY(180deg);
  background:#201c22;
  border:1px solid rgba(205,181,138,.45);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}

.tarot-front img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .15s ease;
}

.tarot-front img.reversed{
  transform:rotate(180deg);
}

.tarot-flip.flipped .tarot-front{
  box-shadow:
    0 0 24px rgba(205,181,138,.11),
    0 10px 30px rgba(0,0,0,.3);
}


/* =========================================================
   牌位
========================================================= */

.card-position{
  margin-bottom:5px;
  color:#b9a88c;
  font-size:10px;
  line-height:1.4;
  min-height:14px;
}

.card-info{
  text-align:center;
  margin-top:10px;
  min-height:54px;
  opacity:0;
  transform:translateY(-4px);
}

.card-info.show{
  animation:
    cardInfoIn .42s
    ease forwards;
}

@keyframes cardInfoIn{
  from{
    opacity:0;
    transform:translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card-name{
  color:#e5dccd;
  font-size:12px;
  line-height:1.4;
}

.card-orientation{
  margin-top:3px;
  color:var(--gold);
  font-size:10px;
}


/* =========================================================
   翻牌底部
========================================================= */

.reveal-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  padding:
    10px
    0
    calc(20px + env(safe-area-inset-bottom));
}

.reveal-actions button{
  flex:1;
  max-width:180px;
}

.save-btn{
  padding:13px 20px;
  border-radius:25px;
  background:
    linear-gradient(
      135deg,
      #d8c49c,
      #b69c6e
    );
  color:#211c17;
  font-size:13px;
}

.save-btn:disabled{
  opacity:.35;
}


/* =========================================================
   问题 / 笔记
========================================================= */

.form-section{
  margin-top:20px;
}

.form-label{
  display:block;
  color:var(--gold2);
  font-size:12px;
  margin-bottom:8px;
  letter-spacing:.05em;
}

.form-input,
.form-textarea{
  width:100%;
  border:1px solid rgba(205,181,138,.16);
  border-radius:10px;
  outline:none;
  background:#18161c;
  color:var(--text);
  padding:12px 13px;
}

.form-input{
  height:43px;
}

.form-textarea{
  min-height:100px;
  resize:vertical;
  line-height:1.7;
}

.form-input:focus,
.form-textarea:focus{
  border-color:rgba(205,181,138,.42);
}


/* =========================================================
   历史
========================================================= */

.history-list{
  margin-top:25px;
  padding-bottom:30px;
}

.history-item{
  padding:16px;
  margin-bottom:10px;
  border:1px solid rgba(205,181,138,.13);
  border-radius:11px;
  background:#17151b;
}

.history-date{
  color:var(--gold);
  font-size:11px;
}

.history-spread{
  margin-top:7px;
  color:#bcae96;
  font-size:11px;
}

.history-question{
  margin-top:8px;
  color:#e8e0d4;
  font-size:13px;
  line-height:1.6;
}

.history-cards{
  margin-top:9px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.history-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:11px;
}

.empty-history{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding-top:60px;
}


/* =========================================================
   弹窗
========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.62);
  opacity:0;
  visibility:hidden;
  transition:
    opacity .25s ease,
    visibility 0s linear .25s;
}

.modal.show{
  opacity:1;
  visibility:visible;
  transition:
    opacity .25s ease,
    visibility 0s linear 0s;
}

.modal-panel{
  width:100%;
  max-width:680px;
  max-height:82vh;
  overflow-y:auto;
  border-radius:18px 18px 0 0;
  background:#1a171e;
  padding:
    24px
    20px
    calc(25px + env(safe-area-inset-bottom));
  transform:translateY(30px);
  transition:
    transform .3s
    cubic-bezier(.2,.8,.2,1);
}

.modal.show .modal-panel{
  transform:translateY(0);
}

.modal-title{
  text-align:center;
  color:var(--gold2);
  font-size:15px;
  letter-spacing:.08em;
}

.detail-spread{
  margin-top:8px;
  text-align:center;
  color:#bcae96;
  font-size:11px;
}

.detail-card{
  margin-top:18px;
  display:flex;
  gap:14px;
  align-items:center;
}

.detail-card img{
  width:65px;
  height:105px;
  object-fit:cover;
  border-radius:6px;
}

.detail-name{
  color:#eee8df;
  font-size:13px;
}

.detail-position{
  margin-bottom:5px;
  color:#bcae96;
  font-size:10px;
}

.detail-orientation{
  margin-top:5px;
  color:var(--gold);
  font-size:11px;
}

.close-modal{
  display:block;
  width:100%;
  margin-top:22px;
  padding:12px;
  border-radius:25px;
  border:1px solid var(--line);
  background:none;
  color:var(--gold2);
}


/* =========================================================
   动画
========================================================= */

.page-enter{
  animation:
    pageEnter .38s
    ease both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =========================================================
   Toast
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:calc(32px + env(safe-area-inset-bottom));
  z-index:50;
  transform:translate(-50%,10px);
  padding:10px 16px;
  border-radius:22px;
  background:rgba(35,31,39,.94);
  border:1px solid rgba(205,181,138,.22);
  color:#e6ddcf;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:
    opacity .25s ease,
    transform .25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================================================

/* =========================================================
   牌阵视觉预览
========================================================= */

function renderSpreadVisual(spread){

  const container =
    document.createElement("div");

  const title =
    document.createElement("div");

  title.className =
    "spread-visual-title";

  title.textContent =
    "牌阵布局预览";

  container.appendChild(title);


  const visual =
    document.createElement("div");

  visual.className =
    "spread-visual";


  let layout =
    SPREAD_LAYOUTS[spread.id];


  if(!layout){

    layout =
      getFallbackLayout(
        spread.positions.length
      );

  }


  spread.positions.forEach(
    (position,index) => {

      const point =
        layout[index] ||
        [50,50];


      const card =
        document.createElement("div");

      card.className =
        "visual-card";


      if(position.significator){
        card.classList.add("significator");
      }


      card.style.left =
        `${point[0]}%`;

      card.style.top =
        `${point[1]}%`;


      card.innerHTML = `

        <span class="visual-number">
          ${position.n}
        </span>

        <span class="visual-label">
          ${position.significator
            ? "切牌／指示牌"
            : position.label}
        </span>

      `;


      visual.appendChild(card);

    }
  );


  container.appendChild(visual);

  return container;

}


function getFallbackLayout(count){

  const result = [];

  const columns =
    count <= 4
      ? count
      : 4;

  const rows =
    Math.ceil(
      count / columns
    );

  for(let i=0;i<count;i++){

    const col =
      i % columns;

    const row =
      Math.floor(i / columns);

    result.push([

      ((col + .5) / columns) * 100,

      ((row + .5) / rows) * 100

    ]);

  }

  return result;

}

/* =========================================================
   洗牌
========================================================= */

function shuffleDeck(source){

  const array =
    [...source];


  for(
    let i = array.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }


  return array;

}

========================================================= */

function renderSelect(){

  const grid =
    $("selectGrid");

  grid.innerHTML = "";


  let availableDeck =
    deck;


  if(
    currentSpread &&
    currentSpread.specialRule ===
    "court_only"
  ){

    availableDeck =
      deck.filter(card =>
        [
          "wapa","wakn","waqu","waki",
          "cupa","cukn","cuqu","cuki",
          "swpa","swkn","swqu","swki",
          "pepa","pekn","pequ","peki"
        ].includes(card.code)
      );

  }


  availableDeck.forEach(card => {

    const originalIndex =
      deck.findIndex(
        item =>
          item.code === card.code
      );


    const item =
      document.createElement("div");


    item.className =
      "select-card";


    if(
      selected.includes(
        originalIndex
      )
    ){

      item.classList.add("selected");

    }


    item.innerHTML = `
      <div class="select-card-inner"></div>
    `;


    item.onclick = () =>
      toggleCard(originalIndex);


    grid.appendChild(item);

  });


  updateSelectCount();


  if(currentSpread){

    $("selectSpreadName").textContent =
      currentSpread.name;


    $("selectDescription").innerHTML =
      `请选择 ${currentSpread.count} 张牌。<br>
       ${currentSpread.description}`;


    if(
      currentSpread.specialRule ===
      "court_only"
    ){

      $("selectModeLabel").textContent =
        "16张宫廷牌｜侍从／骑士／王后／国王各一张";

    }else if(
      currentSpread.specialRule ===
      "significator"
    ){

      $("selectModeLabel").textContent =
        `需要 ${currentSpread.count} 张｜最后一张为切牌／指示牌`;

    }else{

      $("selectModeLabel").textContent =
        `需要 ${currentSpread.count} 张`;

    }

  }else{

    $("selectSpreadName").textContent =
      "凭感觉选牌";


    $("selectDescription").innerHTML =
      `不需要想太久。<br>
       哪张牌吸引你，就选择哪张。`;


    $("selectModeLabel").textContent =
      "自由抽牌";

  }

}


/* =========================================================
   点击牌
========================================================= */

function toggleCard(index){

  const pos =
    selected.indexOf(index);


  if(pos >= 0){

    selected.splice(
      pos,
      1
    );

  }else{

    if(
      currentSpread &&
      selected.length >=
      currentSpread.count
    ){

      showToast(
        `这个牌阵需要 ${currentSpread.count} 张牌`
      );

      return;

    }


    if(
      currentSpread &&
      currentSpread.specialRule ===
      "court_only"
    ){

      const newCard =
        deck[index];


      const rank =
        getCourtRank(
          newCard.code
        );


      const already =
        selected.some(
          selectedIndex =>
            getCourtRank(
              deck[selectedIndex].code
            ) === rank
        );


      if(already){

        showToast(
          `已经选择了一张${rank}，每组只能选择一张`
        );

        return;

      }

    }


    selected.push(index);

  }


  renderSelect();

}


function getCourtRank(code){

  if(code.endsWith("pa")){
    return "侍从";
  }

  if(code.endsWith("kn")){
    return "骑士";
  }

  if(code.endsWith("qu")){
    return "王后";
  }

  if(code.endsWith("ki")){
    return "国王";
  }

  return "";

}


/* =========================================================
   数量
========================================================= */

function updateSelectCount(){

  $("selectCount").textContent =
    `已选择 ${selected.length} 张`;


  if(currentSpread){

    $("confirmBtn").disabled =
      selected.length !==
      currentSpread.count;

  }else{

    $("confirmBtn").disabled =
      selected.length === 0;

  }

}

========================================================= */

function confirmSelection(){

  if(
    currentSpread &&
    selected.length !==
    currentSpread.count
  ){

    showToast(
      `请选择 ${currentSpread.count} 张牌`
    );

    return;

  }


  if(
    !currentSpread &&
    selected.length === 0
  ){

    return;

  }


  readingCards =
    selected.map(
      (index,positionIndex) => ({

        ...deck[index],

        position:
          currentSpread
            ? currentSpread.positions[
                positionIndex
              ]
            : null,

        orientation:null,

        revealed:false

      })
    );


  revealed =
    new Array(
      readingCards.length
    ).fill(false);


  renderReveal();

  showView("revealView");

}

      position.className =
        "card-position";


      if(card.position){

        position.textContent =
          `位置 ${card.position.n} · ${card.position.label}`;

      }


      const flip =
        document.createElement("div");


      flip.className =
        "tarot-flip";


      flip.dataset.index =
        index;


      const inner =
        document.createElement("div");


      inner.className =
        "tarot-inner";


      const back =
        document.createElement("div");


      back.className =
        "tarot-face tarot-back";


      const front =
        document.createElement("div");


      front.className =
        "tarot-face tarot-front";


      const img =
        document.createElement("img");


      img.src =
        `./${card.code}.jpg`;


      img.alt =
        card.name;


      front.appendChild(img);

      inner.appendChild(back);

      inner.appendChild(front);

      flip.appendChild(inner);

      wrapper.appendChild(position);

      wrapper.appendChild(flip);


      const info =
        document.createElement("div");


      info.className =
        "card-info";


      info.id =
        `cardInfo-${index}`;


      info.innerHTML = `

        <div class="card-name">
          ${card.name}
        </div>

        <div
          class="card-orientation"
          id="orientation-${index}"
        ></div>

      `;


      wrapper.appendChild(info);

      grid.appendChild(wrapper);


      flip.addEventListener(
        "click",
        () => flipCard(index)
      );

    }
  );


  updateRevealProgress();

}


/* =========================================================
   真正翻牌
========================================================= */

function flipCard(index){

  if(
    !readingCards[index] ||
    readingCards[index].revealed
  ){

    return;

  }


  const card =
    readingCards[index];


  card.orientation =
    Math.random() < .5
      ? "upright"
      : "reversed";


  card.revealed = true;

  revealed[index] = true;


  const flip =
    document.querySelector(
      `.tarot-flip[data-index="${index}"]`
    );


  if(!flip){
    return;
  }


  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      flip.classList.add("flipped");

    });

  });


  const orientation =
    $(`orientation-${index}`);


  orientation.textContent =
    card.orientation === "upright"
      ? "正位"
      : "逆位";


  const cardImage =
    flip.querySelector("img");


  if(
    card.orientation ===
    "reversed"
  ){

    cardImage.classList.add(
      "reversed"
    );

  }


  const info =
    $(`cardInfo-${index}`);


  setTimeout(() => {

    info.classList.add("show");

  },430);


  updateRevealProgress();

}


/* =========================================================
   全部翻开
========================================================= */

async function revealAll(){

  for(
    let i = 0;
    i < readingCards.length;
    i++
  ){

    if(
      !readingCards[i].revealed
    ){

      flipCard(i);

      await wait(210);

    }

  }

}


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


/* =========================================================
   进度
========================================================= */

function updateRevealProgress(){

  const count =
    readingCards.filter(
      card => card.revealed
    ).length;


  $("revealProgress").textContent =
    `已揭示 ${count} / ${readingCards.length}`;


  $("saveBtn").disabled =
    count !== readingCards.length;

}


/* =========================================================
   保存
========================================================= */

function saveReading(){

  const allRevealed =
    readingCards.every(
      card => card.revealed
    );


  if(!allRevealed){

    showToast(
      "请先揭示全部牌面"
    );

    return;

  }


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const record = {

    id:
      Date.now(),

    date:
      new Date().toISOString(),

    spreadId:
      currentSpread
        ? currentSpread.id
        : null,

    spreadName:
      currentSpread
        ? currentSpread.name
        : "自由抽牌",

    question:
      $("questionInput").value.trim(),

    note:
      $("noteInput").value.trim(),

    cards:
      readingCards.map(card => ({

        position:
          card.position
            ? {
                n:card.position.n,
                label:card.position.label
              }
            : null,

        name:
          card.name,

        code:
          card.code,

        orientation:
          card.orientation

      }))

  };


  history.unshift(record);


  localStorage.setItem(
    "myTarotHistory",
    JSON.stringify(history)
  );


  showToast(
    "已保存这次抽牌"
  );


  setTimeout(() => {

    showHistory();

  },700);

}


/* =========================================================
   历史
========================================================= */

function showHistory(){

  renderHistory();

  showView("historyView");

}


function renderHistory(){

  const list =
    $("historyList");


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  if(history.length === 0){

    list.innerHTML = `

      <div class="empty-history">
        还没有抽牌记录
      </div>

    `;

    return;

  }


  list.innerHTML = "";


  history.forEach(record => {

    const item =
      document.createElement("div");


    item.className =
      "history-item";


    const date =
      new Date(record.date);


    const dateText =
      date.toLocaleString(
        "zh-CN",
        {
          year:"numeric",
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit"
        }
      );


    const names =
      record.cards
        .map(card => {

          const position =
            card.position
              ? `${card.position.label}：`
              : "";

          return `${position}${card.name} · ${
            card.orientation === "upright"
              ? "正"
              : "逆"
          }`;

        })
        .join("　");


    item.innerHTML = `

      <div class="history-date">
        ${dateText}
      </div>

      <div class="history-spread">
        ${record.spreadName || "自由抽牌"}
      </div>

      <div class="history-question">
        ${
          record.question ||
          "未填写问题"
        }
      </div>

      <div class="history-cards">
        ${names}
      </div>

      <div class="history-actions">

        <button
          class="text-btn"
          onclick="openDetail(${record.id})"
        >
          查看
        </button>

        <button
          class="text-btn"
          onclick="deleteRecord(${record.id})"
        >
          删除
        </button>

      </div>

    `;


    list.appendChild(item);

  });

}


/* =========================================================
   历史详情
========================================================= */

function openDetail(id){

  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const record =
    history.find(
      item => item.id === id
    );


  if(!record){
    return;
  }


  const content =
    $("detailContent");


  content.innerHTML = "";


  const spread =
    document.createElement("div");


  spread.className =
    "detail-spread";


  spread.textContent =
    record.spreadName ||
    "自由抽牌";


  content.appendChild(spread);


  if(record.question){

    const q =
      document.createElement("div");


    q.style.marginTop =
      "22px";

    q.style.color =
      "#eee8df";

    q.style.fontSize =
      "13px";

    q.style.lineHeight =
      "1.7";

    q.textContent =
      `问题：${record.question}`;


    content.appendChild(q);

  }


  record.cards.forEach(card => {

    const row =
      document.createElement("div");


    row.className =
      "detail-card";


    row.innerHTML = `

      <img
        src="./${card.code}.jpg"
        alt="${card.name}"
      >

      <div>

        ${
          card.position
            ? `
              <div class="detail-position">
                位置 ${card.position.n} · ${card.position.label}
              </div>
            `
            : ""
        }

        <div class="detail-name">
          ${card.name}
        </div>

        <div class="detail-orientation">
          ${
            card.orientation === "upright"
              ? "正位"
              : "逆位"
          }
        </div>

      </div>

    `;


    content.appendChild(row);

  });


  if(record.note){

    const note =
      document.createElement("div");


    note.style.marginTop =
      "20px";

    note.style.color =
      "#a49d95";

    note.style.fontSize =
      "12px";

    note.style.lineHeight =
      "1.8";

    note.textContent =
      `备注：${record.note}`;


    content.appendChild(note);

  }


  $("detailModal")
    .classList.add("show");

}


function closeDetailModal(){

  $("detailModal")
    .classList.remove("show");

}


function closeModal(event){

  if(
    event.target ===
    $("detailModal")
  ){

    closeDetailModal();

  }

}


/* =========================================================
   删除
========================================================= */

function deleteRecord(id){

  const ok =
    confirm(
      "确定删除这条抽牌记录吗？"
    );


  if(!ok){
    return;
  }


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const newHistory =
    history.filter(
      record =>
        record.id !== id
    );


  localStorage.setItem(
    "myTarotHistory",
    JSON.stringify(
      newHistory
    )
  );


  renderHistory();

}


/* =========================================================
   Toast
========================================================= */

let toastTimer;


function showToast(message){

  const toast =
    $("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    },1800);

}

</script>
