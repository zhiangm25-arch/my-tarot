<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#17151b">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="MY TAROT"
>

<link
  rel="manifest"
  href="./manifest.json"
>

<link
  rel="apple-touch-icon"
  href="https://zhiangm25-arch.github.io/my-tarot/2325ED3E-F36C-495C-BC76-A8E3857AC2D8.png"
>

<title>MY TAROT</title>


<style>

:root{

  --bg:#111016;
  --panel:#17151b;
  --panel2:#1d1a21;
  --gold:#cdb58a;
  --gold2:#e1cfaa;
  --text:#eee8df;
  --muted:#918a82;
  --line:rgba(205,181,138,.20);

}


*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}


html,
body{

  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Helvetica Neue",
    Arial,
    sans-serif;

}


body{

  min-height:100vh;
  overflow-x:hidden;

}


button,
input,
textarea{

  font:inherit;

}


button{

  border:0;
  outline:0;

}


/* =========================
   页面基础
========================= */

.app{

  min-height:100vh;

  padding:
    env(safe-area-inset-top)
    18px
    env(safe-area-inset-bottom);

}


.page{

  width:100%;
  max-width:680px;
  margin:0 auto;
  min-height:100vh;

}


.hidden{

  display:none !important;

}


/* =========================
   顶部
========================= */

.header{

  padding-top:28px;
  text-align:center;

}


.logo{

  color:var(--gold2);
  font-size:25px;
  font-weight:500;
  letter-spacing:.24em;
  margin-left:.24em;

}


.subtitle{

  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.12em;

}


/* =========================
   首页
========================= */

.home-content{

  min-height:
    calc(100vh - 110px);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding-bottom:70px;

}


.home-symbol{

  width:82px;
  height:108px;

  border:
    1px solid
    rgba(205,181,138,.42);

  border-radius:11px;

  display:grid;
  place-items:center;

  color:var(--gold);
  font-size:31px;

  margin-bottom:30px;

  box-shadow:
    0 0 40px
    rgba(205,181,138,.06);

}


.home-question{

  font-size:22px;
  letter-spacing:.08em;
  color:#eee8df;
  margin-bottom:11px;

}


.home-hint{

  color:var(--muted);
  font-size:12px;
  letter-spacing:.06em;
  margin-bottom:34px;

}


.primary-btn{

  min-width:150px;

  padding:14px 26px;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      #d8c49c,
      #b69c6e
    );

  color:#211c17;

  font-size:14px;
  letter-spacing:.08em;

  box-shadow:
    0 7px 25px
    rgba(205,181,138,.12);

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}


.primary-btn:active{

  transform:scale(.96);

  box-shadow:
    0 3px 12px
    rgba(205,181,138,.08);

}


.secondary-btn{

  padding:10px 18px;

  border:
    1px solid
    var(--line);

  border-radius:22px;

  background:transparent;

  color:var(--gold2);

  font-size:12px;

}


.text-btn{

  background:none;

  color:var(--muted);

  font-size:12px;

  padding:8px;

}


/* =========================
   页面标题
========================= */

.page-title{

  margin-top:38px;

  text-align:center;

  font-size:18px;
  font-weight:400;

  letter-spacing:.10em;

}


.page-description{

  margin-top:9px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
  line-height:1.7;

}


.top-actions{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-top:25px;

}


/* =========================
   选择牌
========================= */

.select-count{

  color:var(--gold2);
  font-size:12px;

}


.card-grid{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:9px;

  margin-top:20px;

  padding-bottom:30px;

}


@media(max-width:390px){

  .card-grid{

    grid-template-columns:
      repeat(5,1fr);

    gap:9px;

  }

}


.select-card{

  position:relative;

  aspect-ratio:2 / 3.45;

  perspective:900px;

  cursor:pointer;

}


.select-card-inner{

  position:absolute;

  inset:0;

  border-radius:7px;

  border:
    1px solid
    rgba(205,181,138,.18);

  background:

    radial-gradient(
      circle at center,
      rgba(205,181,138,.12),
      transparent 55%
    ),

    linear-gradient(
      145deg,
      #27222d,
      #17151b
    );

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  transition:
    transform .22s ease,
    border-color .22s ease,
    box-shadow .22s ease;

}


.select-card-inner::before{

  content:"✦";

  color:
    rgba(205,181,138,.35);

  font-size:14px;

}


.select-card.selected
.select-card-inner{

  transform:
    translateY(-4px)
    scale(.96);

  border-color:
    rgba(225,207,170,.8);

  box-shadow:
    0 7px 20px
    rgba(205,181,138,.14);

}


.select-card.selected::after{

  content:"✓";

  position:absolute;

  right:4px;
  top:4px;

  width:17px;
  height:17px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:var(--gold2);

  color:#211c17;

  font-size:10px;
  font-weight:bold;

}


/* =========================
   选择页面底部
========================= */

.select-bottom{

  position:sticky;

  bottom:0;

  padding:
    14px
    0
    calc(14px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to bottom,
      rgba(17,16,22,0),
      rgba(17,16,22,.95) 30%
    );

  text-align:center;

}


.confirm-btn{

  width:100%;
  max-width:330px;

  padding:14px;

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      #d8c49c,
      #b69c6e
    );

  color:#211c17;

  font-size:14px;

  letter-spacing:.08em;

}


.confirm-btn:disabled{

  opacity:.35;

}


/* =========================
   翻牌页面
========================= */

.reveal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-top:30px;

}


.reveal-progress{

  color:var(--muted);
  font-size:12px;

}


.reveal-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:17px;

  margin-top:28px;

  padding-bottom:20px;

}


@media(max-width:390px){

  .reveal-grid{

    gap:12px;

  }

}


/* =========================
   真正的 3D 翻牌
========================= */

.tarot-flip{

  position:relative;

  width:100%;

  aspect-ratio:2 / 3.45;

  perspective:1100px;

  cursor:pointer;

}


.tarot-inner{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  transform-style:preserve-3d;

  transition:
    transform .68s
    cubic-bezier(.22,.75,.25,1);

}


.tarot-flip.flipped
.tarot-inner{

  transform:
    rotateY(180deg);

}


.tarot-face{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  border-radius:9px;

  overflow:hidden;

  backface-visibility:hidden;

  -webkit-backface-visibility:hidden;

}


/* 牌背 */

.tarot-back{

  display:flex;

  align-items:center;
  justify-content:center;

  background:

    radial-gradient(
      circle at center,
      rgba(205,181,138,.10),
      transparent 55%
    ),

    linear-gradient(
      145deg,
      #27222d,
      #141319
    );

  border:
    1px solid
    rgba(205,181,138,.34);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.22);

}


.tarot-back::before{

  content:"✦";

  width:34px;
  height:48px;

  border:
    1px solid
    rgba(205,181,138,.45);

  border-radius:5px;

  display:grid;
  place-items:center;

  color:var(--gold);

  font-size:16px;

  box-shadow:
    inset 0 0 15px
    rgba(205,181,138,.05);

}


/* 点击提示 */

.tarot-back::after{

  content:"点击翻牌";

  position:absolute;

  bottom:9px;

  left:0;
  right:0;

  text-align:center;

  color:
    rgba(225,207,170,.45);

  font-size:9px;

  letter-spacing:.05em;

}


/* 牌面 */

.tarot-front{

  transform:
    rotateY(180deg);

  background:#201c22;

  border:
    1px solid
    rgba(205,181,138,.45);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.28);

}


.tarot-front img{

  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform .15s ease;

}

.tarot-front img.reversed{

  transform:rotate(180deg);

}


/* 翻开后的轻微光晕 */

.tarot-flip.flipped
.tarot-front{

  box-shadow:
    0 0 24px
    rgba(205,181,138,.11),

    0 10px 30px
    rgba(0,0,0,.3);

}


/* =========================
   牌名
========================= */

.card-info{

  text-align:center;

  margin-top:10px;

  min-height:40px;

  opacity:0;

  transform:
    translateY(-4px);

}


.card-info.show{

  animation:
    cardInfoIn .42s
    ease forwards;

}


@keyframes cardInfoIn{

  from{

    opacity:0;

    transform:
      translateY(-5px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


.card-name{

  color:#e5dccd;

  font-size:12px;

  line-height:1.4;

}


.card-orientation{

  margin-top:3px;

  color:var(--gold);

  font-size:10px;

}


/* =========================
   翻牌底部
========================= */

.reveal-actions{

  display:flex;

  gap:10px;

  justify-content:center;

  padding:
    10px
    0
    calc(20px + env(safe-area-inset-bottom));

}


.reveal-actions button{

  flex:1;

  max-width:180px;

}


.save-btn{

  padding:13px 20px;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #d8c49c,
      #b69c6e
    );

  color:#211c17;

  font-size:13px;

}


.save-btn:disabled{

  opacity:.35;

}


/* =========================
   问题 / 笔记
========================= */

.form-section{

  margin-top:20px;

}


.form-label{

  display:block;

  color:var(--gold2);

  font-size:12px;

  margin-bottom:8px;

  letter-spacing:.05em;

}


.form-input,
.form-textarea{

  width:100%;

  border:
    1px solid
    rgba(205,181,138,.16);

  border-radius:10px;

  outline:none;

  background:#18161c;

  color:var(--text);

  padding:12px 13px;

}


.form-input{

  height:43px;

}


.form-textarea{

  min-height:100px;

  resize:vertical;

  line-height:1.7;

}


.form-input:focus,
.form-textarea:focus{

  border-color:
    rgba(205,181,138,.42);

}


/* =========================
   历史记录
========================= */

.history-list{

  margin-top:25px;

  padding-bottom:30px;

}


.history-item{

  padding:16px;

  margin-bottom:10px;

  border:
    1px solid
    rgba(205,181,138,.13);

  border-radius:11px;

  background:#17151b;

}


.history-date{

  color:var(--gold);

  font-size:11px;

}


.history-question{

  margin-top:8px;

  color:#e8e0d4;

  font-size:13px;

  line-height:1.6;

}


.history-cards{

  margin-top:9px;

  color:var(--muted);

  font-size:11px;

}


.history-actions{

  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:11px;

}


.empty-history{

  text-align:center;

  color:var(--muted);

  font-size:12px;

  padding-top:60px;

}


/* =========================
   详情弹窗
========================= */

.modal{

  position:fixed;

  inset:0;

  z-index:30;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  background:
    rgba(0,0,0,.62);

  opacity:0;

  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility 0s linear .25s;

}


.modal.show{

  opacity:1;

  visibility:visible;

  transition:
    opacity .25s ease,
    visibility 0s linear 0s;

}


.modal-panel{

  width:100%;
  max-width:680px;

  max-height:82vh;

  overflow-y:auto;

  border-radius:
    18px
    18px
    0
    0;

  background:#1a171e;

  padding:
    24px
    20px
    calc(25px + env(safe-area-inset-bottom));

  transform:
    translateY(30px);

  transition:
    transform .3s
    cubic-bezier(.2,.8,.2,1);

}


.modal.show
.modal-panel{

  transform:
    translateY(0);

}


.modal-title{

  text-align:center;

  color:var(--gold2);

  font-size:15px;

  letter-spacing:.08em;

}


.detail-card{

  margin-top:18px;

  display:flex;

  gap:14px;

  align-items:center;

}


.detail-card img{

  width:65px;
  height:105px;

  object-fit:cover;

  border-radius:6px;

}


.detail-name{

  color:#eee8df;

  font-size:13px;

}


.detail-orientation{

  margin-top:5px;

  color:var(--gold);

  font-size:11px;

}


.close-modal{

  display:block;

  width:100%;

  margin-top:22px;

  padding:12px;

  border-radius:25px;

  border:
    1px solid
    var(--line);

  background:none;

  color:var(--gold2);

}


/* =========================
   页面进入动画
========================= */

.page-enter{

  animation:
    pageEnter .38s
    ease both;

}


@keyframes pageEnter{

  from{

    opacity:0;

    transform:
      translateY(8px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================
   Toast
========================= */

.toast{

  position:fixed;

  left:50%;

  bottom:
    calc(32px + env(safe-area-inset-bottom));

  z-index:50;

  transform:
    translate(-50%,10px);

  padding:10px 16px;

  border-radius:22px;

  background:
    rgba(35,31,39,.94);

  border:
    1px solid
    rgba(205,181,138,.22);

  color:#e6ddcf;

  font-size:11px;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .25s ease,
    transform .25s ease;

}


.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =========================
   小屏幕
========================= */

@media(max-width:360px){

  .app{

    padding-left:14px;
    padding-right:14px;

  }

  .reveal-grid{

    gap:10px;

  }

  .card-name{

    font-size:11px;

  }

}

</style>

</head>


<body>


<div class="app">

<div class="page">


<!-- =========================
     首页
========================= -->

<section id="homeView">

  <header class="header">

    <div class="logo">
      MY TAROT
    </div>

    <div class="subtitle">
      你选牌，我只负责记录
    </div>

  </header>


  <div class="home-content">

    <div class="home-symbol">
      ✦
    </div>

    <div class="home-question">
      今天，想问什么？
    </div>

    <div class="home-hint">
      静下来，凭第一感觉选择你的牌
    </div>

    <button
      class="primary-btn"
      onclick="startReading()"
    >
      开始抽牌
    </button>

    <button
      class="text-btn"
      style="margin-top:18px"
      onclick="showHistory()"
    >
      查看历史记录
    </button>

  </div>

</section>



<!-- =========================
     选牌页面
========================= -->

<section
  id="selectView"
  class="hidden"
>

  <header class="header">

    <div class="logo">
      MY TAROT
    </div>

    <div class="subtitle">
      选择你的牌
    </div>

  </header>


  <div class="page-title">
    凭感觉选牌
  </div>

  <div class="page-description">
    不需要想太久。<br>
    哪张牌吸引你，就选择哪张。
  </div>


  <div class="top-actions">

    <span
      id="selectCount"
      class="select-count"
    >
      已选择 0 张
    </span>

    <button
      class="secondary-btn"
      onclick="resetSelection()"
    >
      重新选
    </button>

  </div>


  <div
    id="selectGrid"
    class="card-grid"
  ></div>


  <div class="select-bottom">

    <button
      id="confirmBtn"
      class="confirm-btn"
      onclick="confirmSelection()"
      disabled
    >
      选好了
    </button>

  </div>

</section>



<!-- =========================
     翻牌页面
========================= -->

<section
  id="revealView"
  class="hidden"
>

  <header class="header">

    <div class="logo">
      MY TAROT
    </div>

    <div class="subtitle">
      你的牌已经准备好了
    </div>

  </header>


  <div class="reveal-header">

    <button
      class="text-btn"
      onclick="backToSelect()"
    >
      ← 返回
    </button>

    <div
      id="revealProgress"
      class="reveal-progress"
    >
      已揭示 0 / 0
    </div>

  </div>


  <div
    id="revealGrid"
    class="reveal-grid"
  ></div>


  <div class="form-section">

    <label
      class="form-label"
      for="questionInput"
    >
      这次想问什么？
    </label>

    <input
      id="questionInput"
      class="form-input"
      placeholder="可以简单记下一句话"
      maxlength="200"
    >

  </div>


  <div class="form-section">

    <label
      class="form-label"
      for="noteInput"
    >
      备注
    </label>

    <textarea
      id="noteInput"
      class="form-textarea"
      placeholder="记录当时的想法、背景或之后的验证……"
      maxlength="2000"
    ></textarea>

  </div>


  <div class="reveal-actions">

    <button
      class="secondary-btn"
      onclick="revealAll()"
    >
      全部翻开
    </button>

    <button
      id="saveBtn"
      class="save-btn"
      onclick="saveReading()"
      disabled
    >
      保存记录
    </button>

  </div>

</section>



<!-- =========================
     历史记录
========================= -->

<section
  id="historyView"
  class="hidden"
>

  <header class="header">

    <div class="logo">
      MY TAROT
    </div>

    <div class="subtitle">
      HISTORY
    </div>

  </header>


  <div class="top-actions">

    <button
      class="text-btn"
      onclick="goHome()"
    >
      ← 返回
    </button>

  </div>


  <div
    id="historyList"
    class="history-list"
  ></div>

</section>


</div>

</div>



<!-- =========================
     详情弹窗
========================= -->

<div
  id="detailModal"
  class="modal"
  onclick="closeModal(event)"
>

  <div
    class="modal-panel"
    onclick="event.stopPropagation()"
  >

    <div class="modal-title">
      抽牌记录
    </div>

    <div
      id="detailContent"
    ></div>

    <button
      class="close-modal"
      onclick="closeDetailModal()"
    >
      关闭
    </button>

  </div>

</div>



<div
  id="toast"
  class="toast"
></div>



<script>


/* =========================
   工具
========================= */

const $ = id =>
  document.getElementById(id);



/* =========================
   78 张塔罗牌
========================= */

const deck = [

  {name:"愚人",code:"ar00"},
  {name:"魔术师",code:"ar01"},
  {name:"女祭司",code:"ar02"},
  {name:"皇后",code:"ar03"},
  {name:"皇帝",code:"ar04"},
  {name:"教皇",code:"ar05"},
  {name:"恋人",code:"ar06"},
  {name:"战车",code:"ar07"},
  {name:"力量",code:"ar08"},
  {name:"隐者",code:"ar09"},
  {name:"命运之轮",code:"ar10"},
  {name:"正义",code:"ar11"},
  {name:"倒吊人",code:"ar12"},

/* =========================
   状态
========================= */

let selected = [];

let revealed = [];

let readingCards = [];



/* =========================
   页面切换
========================= */

function showView(id){

  const views = [
    "homeView",
    "selectView",
    "revealView",
    "historyView"
  ];

  views.forEach(view => {

    $(view).classList.add("hidden");

  });

  $(id).classList.remove("hidden");

  $(id).classList.add("page-enter");

  setTimeout(() => {

    $(id).classList.remove("page-enter");

  },450);

}


function goHome(){

  showView("homeView");

}


function startReading(){

  selected = [];

  renderSelect();

  showView("selectView");

}



/* =========================
   选牌
========================= */

function renderSelect(){

  const grid =
    $("selectGrid");

  grid.innerHTML = "";


  deck.forEach((card,index) => {

    const item =
      document.createElement("div");

    item.className =
      "select-card";


    if(selected.includes(index)){

      item.classList.add("selected");

    }


    item.innerHTML = `

      <div class="select-card-inner"></div>

    `;


    item.onclick = () =>
      toggleCard(index);


    grid.appendChild(item);

  });


  updateSelectCount();

}


function toggleCard(index){

  const pos =
    selected.indexOf(index);


  if(pos >= 0){

    selected.splice(pos,1);

  }else{

    selected.push(index);

  }


  renderSelect();

}


function updateSelectCount(){

  $("selectCount").textContent =
    `已选择 ${selected.length} 张`;


  $("confirmBtn").disabled =
    selected.length === 0;

}


function resetSelection(){

  selected = [];

  renderSelect();

}


function backToSelect(){

  showView("selectView");

}



/* =========================
   确认选牌
========================= */

function confirmSelection(){

  if(selected.length === 0){

    return;

  }


  readingCards =
    selected.map(index => ({

      ...deck[index],

      orientation:null,

      revealed:false

    }));


  revealed =
    new Array(
      readingCards.length
    ).fill(false);


  renderReveal();


  showView("revealView");

}



/* =========================
   翻牌页面
========================= */

function renderReveal(){

  const grid =
    $("revealGrid");


  grid.innerHTML = "";


  readingCards.forEach(
    (card,index) => {

      const wrapper =
        document.createElement("div");


      const flip =
        document.createElement("div");

      flip.className =
        "tarot-flip";

      flip.dataset.index =
        index;


      const inner =
        document.createElement("div");

      inner.className =
        "tarot-inner";


      const back =
        document.createElement("div");

      back.className =
        "tarot-face tarot-back";


      const front =
        document.createElement("div");

      front.className =
        "tarot-face tarot-front";


      const img =
        document.createElement("img");


      img.src =
        `./${card.code}.jpg`;


      img.alt =
        card.name;


      front.appendChild(img);


      inner.appendChild(back);

      inner.appendChild(front);

      flip.appendChild(inner);

      wrapper.appendChild(flip);


      const info =
        document.createElement("div");

      info.className =
        "card-info";

      info.id =
        `cardInfo-${index}`;


      info.innerHTML = `

        <div class="card-name">
          ${card.name}
        </div>

        <div
          class="card-orientation"
          id="orientation-${index}"
        ></div>

      `;


      wrapper.appendChild(info);

      grid.appendChild(wrapper);


      flip.addEventListener(
        "click",
        () => flipCard(index)
      );

    }
  );


  updateRevealProgress();

}



/* =========================
   真正翻牌
========================= */

function flipCard(index){

  if(
    !readingCards[index] ||
    readingCards[index].revealed
  ){

    return;

  }


  const card =
    readingCards[index];


  card.orientation =
    Math.random() < .5
      ? "upright"
      : "reversed";


  card.revealed = true;

  revealed[index] = true;


  const flip =
    document.querySelector(
      `.tarot-flip[data-index="${index}"]`
    );


  if(!flip){

    return;

  }


  /*
    等待浏览器完成初始渲染，
    再添加 flipped，
    确保 iPhone Safari 真正播放 3D 翻牌。
  */

  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      flip.classList.add("flipped");

    });

  });


  const orientation =
  $(`orientation-${index}`);

orientation.textContent =
  card.orientation === "upright"
    ? "正位"
    : "逆位";


const cardImage =
  flip.querySelector("img");

if(card.orientation === "reversed"){

  cardImage.classList.add("reversed");

}


  const info =
    $(`cardInfo-${index}`);


  setTimeout(() => {

    info.classList.add("show");

  },430);


  updateRevealProgress();

}



/* =========================
   全部翻开
========================= */

async function revealAll(){

  for(
    let i = 0;
    i < readingCards.length;
    i++
  ){

    if(
      !readingCards[i].revealed
    ){

      flipCard(i);

      await wait(210);

    }

  }

}


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}



/* =========================
   进度
========================= */

function updateRevealProgress(){

  const count =
    readingCards.filter(
      card => card.revealed
    ).length;


  $("revealProgress").textContent =
    `已揭示 ${count} / ${readingCards.length}`;


  $("saveBtn").disabled =
    count !== readingCards.length;

}



/* =========================
   保存记录
========================= */

function saveReading(){

  const allRevealed =
    readingCards.every(
      card => card.revealed
    );


  if(!allRevealed){

    showToast("请先揭示全部牌面");

    return;

  }


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const record = {

    id:
      Date.now(),

    date:
      new Date().toISOString(),

    question:
      $("questionInput").value.trim(),

    note:
      $("noteInput").value.trim(),

    cards:
      readingCards.map(card => ({

        name:
          card.name,

        code:
          card.code,

        orientation:
          card.orientation

      }))

  };


  history.unshift(record);


  localStorage.setItem(
    "myTarotHistory",
    JSON.stringify(history)
  );


  showToast("已保存这次抽牌");


  setTimeout(() => {

    showHistory();

  },700);

}



/* =========================
   历史记录
========================= */

function showHistory(){

  renderHistory();

  showView("historyView");

}


function renderHistory(){

  const list =
    $("historyList");


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  if(history.length === 0){

    list.innerHTML = `

      <div class="empty-history">
        还没有抽牌记录
      </div>

    `;

    return;

  }


  list.innerHTML = "";


  history.forEach(record => {

    const item =
      document.createElement("div");


    item.className =
      "history-item";


    const date =
      new Date(record.date);


    const dateText =
      date.toLocaleString(
        "zh-CN",
        {
          year:"numeric",
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit"
        }
      );


    const names =
      record.cards
        .map(card =>
          `${card.name} · ${
            card.orientation === "upright"
              ? "正"
              : "逆"
          }`
        )
        .join("　");


    item.innerHTML = `

      <div class="history-date">
        ${dateText}
      </div>

      <div class="history-question">
        ${
          record.question ||
          "未填写问题"
        }
      </div>

      <div class="history-cards">
        ${names}
      </div>

      <div class="history-actions">

        <button
          class="text-btn"
          onclick="openDetail(${record.id})"
        >
          查看
        </button>

        <button
          class="text-btn"
          onclick="deleteRecord(${record.id})"
        >
          删除
        </button>

      </div>

    `;


    list.appendChild(item);

  });

}



/* =========================
   历史详情
========================= */

function openDetail(id){

  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const record =
    history.find(
      item => item.id === id
    );


  if(!record){

    return;

  }


  const content =
    $("detailContent");


  content.innerHTML = "";


  if(record.question){

    const q =
      document.createElement("div");


    q.style.marginTop =
      "22px";


    q.style.color =
      "#eee8df";


    q.style.fontSize =
      "13px";


    q.style.lineHeight =
      "1.7";


    q.textContent =
      `问题：${record.question}`;


    content.appendChild(q);

  }


  record.cards.forEach(card => {

    const row =
      document.createElement("div");


    row.className =
      "detail-card";


    row.innerHTML = `

      <img
        src="./${card.code}.jpg"
        alt="${card.name}"
      >

      <div>

        <div class="detail-name">
          ${card.name}
        </div>

        <div class="detail-orientation">
          ${
            card.orientation === "upright"
              ? "正位"
              : "逆位"
          }
        </div>

      </div>

    `;


    content.appendChild(row);

  });


  if(record.note){

    const note =
      document.createElement("div");


    note.style.marginTop =
      "20px";


    note.style.color =
      "#a49d95";


    note.style.fontSize =
      "12px";


    note.style.lineHeight =
      "1.8";


    note.textContent =
      `备注：${record.note}`;


    content.appendChild(note);

  }


  $("detailModal")
    .classList.add("show");

}


function closeDetailModal(){

  $("detailModal")
    .classList.remove("show");

}


function closeModal(event){

  if(
    event.target ===
    $("detailModal")
  ){

    closeDetailModal();

  }

}



/* =========================
   删除记录
========================= */

function deleteRecord(id){

  const ok =
    confirm(
      "确定删除这条抽牌记录吗？"
    );


  if(!ok){

    return;

  }


  const history =
    JSON.parse(
      localStorage.getItem(
        "myTarotHistory"
      ) || "[]"
    );


  const newHistory =
    history.filter(
      record => record.id !== id
    );


  localStorage.setItem(
    "myTarotHistory",
    JSON.stringify(newHistory)
  );


  renderHistory();

}



/* =========================
   Toast
========================= */

let toastTimer;


function showToast(message){

  const toast =
    $("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },1800);

}
